<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="抗病毒助手">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>抗病毒藥物助手</title>
<style>
/* Layout: 處方箋式雙欄 — 左欄病人卡（腎功能、過敏、懷孕）固定，右欄分頁決策流程；劑量以等寬字突出，可直接抄寫醫囑 */
:root{
  --bg:#edf1f0; --surface:#ffffff; --surface2:#f5f8f7; --ink:#13201d; --muted:#596a66; --line:#d3ddda;
  --accent:#0a6a5f; --accent-ink:#ffffff; --accent-weak:#dbeee9;
  --warn:#8f5400; --warn-bg:#fcefd8; --danger:#ae2a20; --danger-bg:#fae4e1;
  --ok:#1d7344; --ok-bg:#def2e6; --info:#2a5a86; --info-bg:#e3edf7;
  --f-body:"IBM Plex Sans","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono","Noto Sans TC",ui-monospace,Menlo,Consolas,monospace;
  --s3:#1d6b45; --s3-ink:#ffffff; --s2:#9ccf72; --s2-ink:#14301c; --s1:#f0c64a; --s1-ink:#3a2c00; --s0:#d9534f; --s0-ink:#ffffff;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1514; --surface:#151f1d; --surface2:#1a2624; --ink:#e1ebe8; --muted:#94a6a1; --line:#2a3a37;
  --accent:#4dc0ae; --accent-ink:#04201b; --accent-weak:#163933;
  --warn:#f2b45c; --warn-bg:#382810; --danger:#ff8b80; --danger-bg:#3b1a17;
  --ok:#6fd39a; --ok-bg:#142e1e; --info:#93bde6; --info-bg:#16283a; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0e1514; --surface:#151f1d; --surface2:#1a2624; --ink:#e1ebe8; --muted:#94a6a1; --line:#2a3a37;
  --accent:#4dc0ae; --accent-ink:#04201b; --accent-weak:#163933;
  --warn:#f2b45c; --warn-bg:#382810; --danger:#ff8b80; --danger-bg:#3b1a17;
  --ok:#6fd39a; --ok-bg:#142e1e; --info:#93bde6; --info-bg:#16283a; color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{max-width:1260px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px}
h1,h2,h3{text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px;margin-bottom:12px}
.brand h1{font-size:1.45rem;font-weight:700;letter-spacing:.01em}
.brand .sub{color:var(--muted);font-size:.85rem}
.ver{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.disc{background:var(--warn-bg);color:var(--warn);border-radius:var(--r);padding:9px 14px;font-size:.86rem;margin-bottom:16px}
.disc b{font-weight:600}

.cols{display:grid;grid-template-columns:330px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:920px){.cols{grid-template-columns:minmax(0,1fr)}}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:14px}
@media (max-width:920px){.side{position:static}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.card h2{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:10px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field label,.lbl{font-size:.8rem;color:var(--muted)}
.field input:not([type=radio]):not([type=checkbox]),.field select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--ink);font:inherit;font-family:var(--f-mono);font-size:.95rem}
.field select{font-family:var(--f-body)}
.unit{font-size:.75rem;color:var(--muted)}

.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;margin:0}
.seg label{position:relative}
.seg label,.chip{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:5px 12px;font-size:.86rem;cursor:pointer;user-select:none;line-height:1.35}
.seg input:checked+span{color:var(--accent-ink)}
.seg label:has(input:checked){background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip:disabled{opacity:.5;cursor:not-allowed}
.chip .n{font-family:var(--f-mono);font-size:.75rem;opacity:.75;margin-right:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}

.rsum{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--accent-weak)}
.rsum .big{font-family:var(--f-mono);font-size:1.25rem;font-weight:600}
.rsum .small{font-size:.8rem;color:var(--muted)}
.rsum.empty{background:var(--warn-bg);color:var(--warn)}
.rsum.arc{background:var(--info-bg)}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:.88rem;cursor:pointer}
.chk input{margin-top:3px;accent-color:var(--accent)}
.linkbtn{background:none;border:0;color:var(--accent);padding:0;cursor:pointer;font-size:.82rem;text-decoration:underline}

.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:16px;scrollbar-width:none}
.tab{background:none;border:0;padding:9px 12px;font-size:.93rem;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}

.step{margin-bottom:18px}
.step>h3{font-size:.95rem;font-weight:600;margin-bottom:8px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;min-width:0;overflow-wrap:anywhere}
.step>h3 .k{font-family:var(--f-mono);font-size:.78rem;color:var(--accent)}
.hint{font-size:.82rem;color:var(--muted);margin-top:6px}

details.mdr{margin-top:8px}
details summary{cursor:pointer;font-size:.86rem;color:var(--accent)}
.mdrlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px 14px;margin-top:8px}

.ctx{background:var(--info-bg);color:var(--ink);border-radius:var(--r);padding:10px 14px;font-size:.88rem;margin-bottom:14px}
.ctx b{color:var(--info)}

.paths{display:flex;flex-wrap:wrap;gap:6px}
.res{display:grid;gap:12px}
.opt{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.opt.primary{border-left:4px solid var(--accent)}
.opt-head{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:8px}
.tier{font-size:.8rem;font-weight:600;padding:2px 9px;border-radius:6px;background:var(--surface2);border:1px solid var(--line)}
.tier.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tier.po{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.tier.add,.tier.esc{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.tier.allergy{background:var(--danger-bg);color:var(--danger);border-color:transparent}
.pick,.plus{font-size:.76rem;color:var(--muted);letter-spacing:.04em;margin:4px 0}
.plus{color:var(--warn);font-weight:600}
.formula{background:var(--accent-weak);border-radius:8px;padding:8px 10px;font-size:.92rem;margin-bottom:6px}
.fhint{color:var(--muted);font-size:.8rem;margin-left:4px}
.sep{font-size:.76rem;color:var(--muted);font-weight:600;margin:0}
.plan{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--surface2)}
.plan-h{font-size:.84rem;font-weight:600;color:var(--accent);padding:2px 0 4px}
.pick{text-align:left}
.rx{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:8px 0;border-top:1px dashed var(--line)}
.rx:first-of-type{border-top:0}
.rx-head{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;min-width:0}
.rx-name{font-weight:600}
.brandbtn{background:none;border:0;padding:0;font:inherit;font-weight:600;color:var(--ink);cursor:pointer;text-decoration:underline dotted var(--muted);text-underline-offset:3px}
.brand{font-size:.78rem;background:var(--info-bg);color:var(--info);border-radius:6px;padding:1px 8px}
.route{font-family:var(--f-mono);font-size:.72rem;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.rx-dose{grid-column:1/2;font-family:var(--f-mono);font-size:.98rem;font-weight:600;color:var(--ink);overflow-wrap:anywhere}
.rx-dose .w{font-weight:400;color:var(--muted);font-size:.85rem}
.rx-meta{grid-column:1/2;font-size:.8rem;color:var(--muted)}
.rx .copy{grid-column:2/3;grid-row:1/3;align-self:start;border:1px solid var(--line);background:var(--surface2);border-radius:6px;padding:3px 9px;font-size:.78rem;cursor:pointer}
.rx.blocked .rx-name,.rx.blocked .rx-dose{text-decoration:line-through;text-decoration-color:var(--danger);opacity:.65}
.adj{color:var(--warn);font-weight:600}
.flag{font-size:.72rem;padding:1px 7px;border-radius:999px;line-height:1.5}
.flag.danger{background:var(--danger-bg);color:var(--danger)}
.flag.warn{background:var(--warn-bg);color:var(--warn)}
.flag.ok{background:var(--ok-bg);color:var(--ok)}
.flag.info{background:var(--info-bg);color:var(--info)}
details.ix{grid-column:1/-1;font-size:.82rem}
details.ix ul{margin:4px 0 0;padding-left:18px}
.cond,.onote{font-size:.84rem;margin-top:6px}
.cond{color:var(--warn)}
.srcs{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.src{font-size:.7rem;font-family:var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;cursor:help}
.upd{font-size:.7rem;font-weight:700;color:var(--ok);background:var(--ok-bg);border-radius:4px;padding:1px 6px;letter-spacing:.03em}

.notes{display:grid;gap:8px}
.note{font-size:.88rem;padding:9px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.note.warn{background:var(--warn-bg);border-color:transparent}
.note.danger{background:var(--danger-bg);border-color:transparent}
.dur{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.dur .k{font-size:.78rem;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.dur .v{font-weight:600}
.sec-title{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:6px 0 2px}

.tgt{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.tgt h3{font-size:1.02rem;font-style:italic}
.tgt .pnote{font-size:.86rem;color:var(--muted);margin:4px 0 10px}

.favs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:14px}
.fav{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:.82rem}
.fav button{background:none;border:0;cursor:pointer;padding:4px 10px}
.fav button+button{padding:4px 9px 4px 0;color:var(--muted)}
.btn{border:1px solid var(--accent);color:var(--accent);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:.86rem;cursor:pointer}
.btn.solid{background:var(--accent);color:var(--accent-ink)}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.76rem;color:var(--muted);font-weight:600;letter-spacing:.04em}
.sev{font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:999px;white-space:nowrap}
.sev.x{background:var(--danger-bg);color:var(--danger)}
.sev.h{background:var(--warn-bg);color:var(--warn)}
.sev.m{background:var(--info-bg);color:var(--info)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.92rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:var(--f-mono);font-weight:600}
.reflist{font-size:.86rem;padding-left:18px}
.reflist li{margin-bottom:6px}
.reflist b{font-family:var(--f-mono);font-size:.78rem}
.sus{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center}
.sus .seg label{padding:2px 10px}

.dot{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font-size:.7rem;font-weight:700;font-family:var(--f-mono);line-height:1}
.dot.s3{background:var(--s3);color:var(--s3-ink)} .dot.s2{background:var(--s2);color:var(--s2-ink)}
.dot.s1{background:var(--s1);color:var(--s1-ink)} .dot.s0{background:var(--s0);color:var(--s0-ink)}
.tbl-wrap.spec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table.grid{width:auto;min-width:100%}
table.grid th,table.grid td{text-align:center;padding:3px 4px;border-bottom:0}
table.grid .stick{position:sticky;left:0;background:var(--surface);z-index:1;text-align:left;border-right:1px solid var(--line)}
table.grid thead th{position:sticky;top:0;background:var(--surface);z-index:2;border-bottom:1px solid var(--line)}
table.grid thead th.stick{z-index:3}
table.grid tr.gap td{height:8px;padding:0}
table.grid tr.sel th,table.grid tr.sel td{background:var(--accent-weak)}
table.grid td.hl{background:var(--accent-weak)}
table.grid.cmp th.cmph{font-size:.72rem;font-weight:600;white-space:normal;min-width:58px;max-width:90px;line-height:1.25;vertical-align:bottom}
table.grid.cmp tbody th{vertical-align:middle}
table.grid.cmp tr.xrow th,table.grid.cmp tr.xrow td{border-top:1px dashed var(--line)}
.cellbtn{background:none;border:0;padding:2px;cursor:pointer;border-radius:50%;line-height:0}
.cellbtn[aria-pressed="true"] .dot{outline:2px solid var(--accent);outline-offset:2px}
.cmpsum div+div{margin-top:4px}
.colbtn,.rowbtn{background:none;border:0;cursor:pointer;font:inherit;color:var(--ink)}
.colbtn{font-size:.72rem;padding:4px 3px;border-radius:6px;white-space:nowrap}
.colbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.rowbtn{font-size:.84rem;padding:2px 4px;text-align:left;white-space:nowrap}
.rowbtn:hover,.colbtn:hover{text-decoration:underline}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:.82rem;margin:10px 0 4px}
.legend .dot{width:22px;height:22px;margin-right:2px}
.fixbar{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;max-width:calc(100vw - 32px)}
.fixbar .btn{box-shadow:0 4px 14px rgba(0,0,0,.18)}
.fixbar .jump{position:static}
.fixpad{height:64px}
.abgv{font-family:var(--f-mono);font-weight:600}
.abgv.hi{color:var(--ok)}
.abgv.mid{color:var(--warn)}
.abgv.lo{color:var(--danger)}
.cond.abgw{font-size:.82rem}
.jump{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:.88rem;z-index:20}
.muted{color:var(--muted)}
.mt{margin-top:10px}
@media (prefers-reduced-motion:no-preference){.chip,.tab,.seg label{transition:background .12s,color .12s,border-color .12s}}

/* v0.7 精簡介面 */
.disc{display:flex;gap:8px 12px;align-items:flex-start;justify-content:space-between}
.disc .linkbtn{color:var(--warn);white-space:nowrap;flex:none}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card-h h2{margin-bottom:10px}
.ptbar{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;cursor:pointer;font-size:.9rem}
.ptbar .lab{font-size:.78rem;color:var(--muted);flex:none}
.ptbar .val{flex:1;min-width:0;font-family:var(--f-mono);font-weight:600;overflow-wrap:anywhere}
.ptbar .act{flex:none;font-size:.82rem;color:var(--accent)}
.ptbar.empty{background:var(--warn-bg);border-color:transparent}
.ptbar.empty .val{color:var(--warn);font-family:var(--f-body);font-weight:500}
.mmore{margin-top:6px}
.ptbody{display:flex;flex-direction:column;gap:14px}
.picked{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin-bottom:12px;font-size:.95rem}
.picked .k{font-family:var(--f-mono);font-size:.78rem;color:var(--accent)}
.picked .q{color:var(--muted);font-size:.86rem}
.picked b{font-weight:600}
.rtag{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
button.flag{border:0;cursor:pointer;font:inherit;font-size:.76rem;padding:2px 9px}
.step>h3 .flag{font-weight:500}
.step>h3 .act{margin-left:auto;font-weight:400}
.rx-more{grid-column:1/2;font-size:.8rem;color:var(--muted);display:grid;gap:2px}
.rx-more .brand{justify-self:start}
details.more{border-top:1px solid var(--line);padding-top:8px}
details.more>summary{font-size:.86rem}
details.more>.notes,details.more>.paths,details.more>.ctx{margin-top:8px}
.dgrp+.dgrp{border-top:1px solid var(--line);margin-top:8px;padding-top:8px}
.mxw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;margin:8px 0}
table.mx{border-collapse:collapse;font-size:.78rem;width:100%}
table.mx th,table.mx td{padding:3px 2px;text-align:center;border-bottom:1px solid var(--line)}
table.mx thead th{font-weight:600;color:var(--muted);font-size:.72rem;white-space:nowrap;padding:6px 2px}
table.mx .mxn{position:sticky;left:0;text-align:left;background:var(--surface);min-width:118px;max-width:128px;padding:3px 6px;z-index:1;border-right:1px solid var(--line)}
table.mx .mxg td{background:var(--accent-weak);text-align:left;font-size:.72rem;color:var(--muted);letter-spacing:.04em;padding:3px 6px}
table.mx .mxn .linkbtn{font-size:.76rem;text-align:left;text-decoration:none;color:var(--ink);line-height:1.25;word-break:break-word}
button.mxc{background:none;border:0;min-width:30px;min-height:30px;font-size:1rem;cursor:pointer;line-height:1;padding:0}
.mxc.c1{color:var(--accent)}.mxc.c2{color:var(--info)}.mxc.c3{color:var(--danger)}.mxc.c4{color:var(--warn)}.mxc.c5{color:var(--muted)}
.mxe{color:var(--muted);opacity:.5}
.mxlg{display:grid;gap:3px;font-size:.82rem;margin-top:6px}
.mxlg b{display:inline-block;min-width:1.4em;text-align:center}
.dg-h{font-size:.74rem;color:var(--muted);letter-spacing:.04em;margin-bottom:5px}
details.pathsel{border-top:0;padding-top:0;margin:-6px 0 18px}
details.pathsel>summary{font-size:.92rem}
.srcs .linkbtn{font-size:.74rem;margin-left:2px}
button.src,button.upd{font:inherit;cursor:pointer}
button.src{font-family:var(--f-mono);font-size:.7rem;background:none;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px}
button.upd{font-size:.7rem;font-weight:700;color:var(--ok);background:var(--ok-bg);border:0;border-radius:4px;padding:1px 6px;letter-spacing:.03em}
.top .brand{background:none;color:inherit;padding:0;border-radius:0;font-size:inherit}
@media (max-width:920px){.tab{padding:9px 8px}}
/* v1.4 分頁分組（4 組＋第二層）、返回列、方案卡底列 */
@media (max-width:920px){.tabs .tab{flex:1 1 0;text-align:center}}

<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>抗病毒藥物助手</h1>
      <div class="sub">成人流感、COVID-19、RSV、HSV、VZV、CMV：治療、預防、抗藥，劑量依腎功能調整</div>
    </div>
    <div class="ver" id="ver"></div>
  </header>
  <div class="disc" id="disc"><span><b>僅供臨床參考。</b>最終處方以院內規範、藥師與感染科意見為準。本頁不儲存任何病人資料。</span><button class="linkbtn" type="button" data-act="disc-ok">知道了</button></div>

  <div class="cols">
    <aside class="side" id="side">
      <button class="ptbar" type="button" id="ptBar" data-act="pt-open" aria-expanded="false" aria-controls="ptBody" hidden></button>
      <div id="ptBody" class="ptbody">
      <section class="card" id="ptPanel">
        <div class="card-h"><h2>病人與腎功能</h2><span><button class="linkbtn" type="button" data-act="clear-all">清除全部</button>　<button class="linkbtn" type="button" data-act="pt-close">收合</button></span></div>
        <div class="grid2">
          <div class="field"><label for="age">年齡</label><input id="age" type="number" inputmode="numeric" min="18" max="110" placeholder="歲"></div>
          <div class="field"><span class="lbl">性別</span>
            <div class="seg" role="radiogroup" aria-label="性別">
              <label><input type="radio" name="sex" id="sexM" value="M" checked><span>男</span></label>
              <label><input type="radio" name="sex" id="sexF" value="F"><span>女</span></label>
            </div>
          </div>
          <div class="field"><label for="wt">體重 <span class="unit">kg</span></label><input id="wt" type="number" inputmode="decimal" min="20" max="300" placeholder="kg"></div>
          <div class="field"><label for="ht">身高 <span class="unit">cm</span></label><input id="ht" type="number" inputmode="decimal" min="120" max="230" placeholder="cm"></div>
          <div class="field"><label for="scr">SCr <span class="unit">mg/dL</span></label><input id="scr" type="number" inputmode="decimal" step="0.01" min="0.1" max="20" placeholder="mg/dL"></div>
        </div>
        <div class="field mt"><span class="lbl">腎功能評估方式</span>
          <div class="seg" role="radiogroup" aria-label="腎功能評估方式">
            <label><input type="radio" name="method" value="cg" checked><span>CG 自動計算</span></label>
            <button class="chip" type="button" id="mMoreBtn" data-act="m-more" aria-expanded="false" aria-controls="mMore">其他方式 ▾</button>
          </div>
          <div class="seg mmore" id="mMore" role="radiogroup" aria-label="其他腎功能評估方式" hidden>
            <label><input type="radio" name="method" value="crcl"><span>輸入 CrCl</span></label>
            <label><input type="radio" name="method" value="egfr"><span>輸入 eGFR</span></label>
            <label><input type="radio" name="method" value="hd"><span>HD</span></label>
            <label><input type="radio" name="method" value="pd"><span>PD</span></label>
            <label><input type="radio" name="method" value="crrt"><span>CRRT</span></label>
          </div>
        </div>
        <div class="field mt" id="crclRow" hidden><label for="crclIn">CrCl <span class="unit">mL/min</span></label><input id="crclIn" type="number" inputmode="decimal" min="0" max="250"></div>
        <div class="field mt" id="egfrRow" hidden><label for="egfrIn">eGFR <span class="unit">mL/min/1.73m²</span></label><input id="egfrIn" type="number" inputmode="decimal" min="0" max="250"></div>
        <label class="chk mt"><input type="checkbox" id="aki"><span>腎功能不穩定（AKI、Cr 快速變化）</span></label>
        <div id="rsum" class="rsum empty"></div>
      </section>

      <section class="card">
        <h2>懷孕</h2>
        <label class="chk"><input type="checkbox" id="preg"><span>懷孕（標示不建議的藥並列替代）</span></label>
      </section>
      </div>
    </aside>

    <main>
      <div class="srch"><input id="q" type="search" placeholder="搜尋：藥名、商品名、診斷、預防、抗藥" autocomplete="off" aria-label="搜尋" aria-controls="qres"><div id="qres" class="qres" hidden></div></div>
      <nav class="tabs" role="tablist" id="tabs"></nav>
      <div id="main"></div>
    </main>
  </div>
  <footer class="foot" id="foot"><div id="footDisc" hidden><b>僅供臨床參考。</b>最終處方以院內規範、藥師與感染科意見為準。本頁不儲存任何病人資料。</div><div><button class="linkbtn" type="button" data-act="tab" data-v="ref">全部出處 ›</button></div><div class="ver" id="footVer"></div></footer>
</div>

/* ---------------- 出處 ---------------- */
const REF = {
  // 流感
  CDC_FLU26:{s:"CDC 流感抗病毒藥 2026",f:"CDC. Influenza Antiviral Medications: Summary for Clinicians（頁面更新 2026-03-10）。住院、重症／病情進展、高風險者盡快治療，不等檢驗；住院者 oseltamivir 口服或經腸道，>48 小時仍可能有效；住院者不常規用 zanamivir、baloxavir、peramivir；嚴重免疫低下不建議 baloxavir 單用；懷孕首選 oseltamivir、不建議 baloxavir；暴露後預防 7 天、機構群聚至少 2 週並持續到最後一例後 1 週；腎調整表（oseltamivir、peramivir）。",u:"https://www.cdc.gov/flu/hcp/antivirals/summary-clinicians.html"},
  IDSA_FLU18:{s:"IDSA 流感 2018",f:"Uyeki TM, et al. Clinical Practice Guidelines by the IDSA: 2018 Update on Diagnosis, Treatment, Chemoprophylaxis, and Institutional Outbreak Management of Seasonal Influenza. Clin Infect Dis 2019;68:895–902。仍為現行 IDSA 流感治療指引（2025 年 IDSA 另發表免疫低下者疫苗指引，不涉治療）。"},
  WHO_FLU24:{s:"WHO 流感 2024",f:"WHO. Clinical practice guidelines for influenza（2024-09-12；BMJ 2026;392:e087397 摘要）。非重症：高風險者 baloxavir（conditional）；oseltamivir、zanamivir 用於非重症為 strong against；peramivir、laninamivir conditional against；低風險者 baloxavir conditional against。重症：oseltamivir（conditional）、peramivir conditional against。暴露後預防：季節性流感只建議極高風險者（conditional）。",u:"https://cdn.who.int/media/docs/default-source/health-care-readiness/clinical-guidelines-for-influenza---executive-summary.pdf"},
  OSE_LABEL:{s:"Oseltamivir 仿單",f:"Tamiflu（oseltamivir）US Prescribing Information。治療 75 mg BID × 5 天；預防 75 mg QD 至少 10 天（社區流行最多 6 週）。腎調整：治療 CrCl >30–60：30 mg BID；>10–30：30 mg QD；HD：30 mg 後每次 HD 後 30 mg（療程 ≤5 天）；CAPD：單次 30 mg；ESRD 未透析不建議。預防 CrCl >30–60：30 mg QD；>10–30：30 mg QOD；HD：隔次 HD 後 30 mg；CAPD：每週 30 mg。"},
  ZAN_LABEL:{s:"Zanamivir 仿單",f:"Relenza（zanamivir）吸入劑仿單與 CDC 表 1：治療 10 mg（2 吸）BID × 5 天、預防 10 mg QD；5 天療程不需腎調整；不建議用於有氣喘、COPD 等呼吸道疾病者。"},
  PER_LABEL:{s:"Peramivir 仿單（美國）",f:"Rapivab（peramivir）US PI 與 CDC 表：單次 600 mg IV（CrCl ≥50）；CrCl 30–49：200 mg；10–29：100 mg；HD：透析後依 CrCl 給藥。台灣上市品為瑞貝塔（Rapiacta），用法與美國仿單不同，請以院內仿單確認。"},
  BX_TW:{s:"Baloxavir 台灣仿單 2024",f:"紓伏效膜衣錠 20 mg（Xofluza）衛部藥輸字第 027693 號，版本日期 2024-04-12。適用 ≥5 歲且 ≥20 kg 之 A、B 型流感治療，及密切接觸後預防。CrCl ≥30 不需調整，<30 無資料；避免與乳製品、制酸劑、鈣鐵鎂鋅硒等多價陽離子併服。成人 20–<80 kg 單次 40 mg、≥80 kg 單次 80 mg（CDC 表）。",u:"https://ksph.kcg.gov.tw/7/dfiles_pdf/Xofluza.pdf"},
  CENTERSTONE:{s:"CENTERSTONE（NEJM 2025）",f:"Monto AS, et al. Efficacy of Baloxavir Treatment in Preventing Transmission of Influenza. N Engl J Med 2025;392:1582–1593。Phase 3b：發病 48 小時內單次 baloxavir 治療指標病人，家戶接觸者第 5 天前檢驗確認感染的勝算下降 32%（9.5% vs 13.4%）；7.2% 治療者出現抗藥變異，但未在家戶接觸者檢出。"},
  TW_FLU_RES:{s:"台灣流感抗藥監測（新聞）",f:"TVBS 2025-10-03 報導引述疾管署署長：本流感季 A(H1N1) 約 6.5% 對 oseltamivir 及 peramivir 出現抗藥突變（前一季 3.2%）；A(H3N2) 與 B 型未檢出；baloxavir 對所有病毒株仍有效。新聞來源，請以疾管署原始資料確認。",u:"https://health.tvbs.com.tw/nutrition/358002"},
  TW_ID_FLU24:{s:"台灣感染症醫學會流感 2024",f:"台灣感染症醫學會「抗流感病毒藥物使用建議（2024 年修訂版）」（2024-11 公告，見 MyGoPen 2025-02-12 轉述）。本版未取得全文，個別建議請確認。"},
  // COVID-19
  IDSA_COV25:{s:"IDSA COVID 2025",f:"2025 Clinical Practice Guideline Update by the IDSA on the Treatment and Management of COVID-19: Antiviral Treatment for Mild to Moderate COVID-19 in Adults（Clin Infect Dis；9 條建議）。高風險（例：≥75 歲、嚴重免疫低下、多重危險因子）：建議 nirmatrelvir/ritonavir 5 天（發病 5 天內）或 remdesivir 3 天（7 天內）；風險增加但非高風險：建議（conditional）同上；無危險因子：不建議抗病毒藥；molnupiravir 只在無其他選擇時（conditional）。本版依 NEJM Clinician Guideline Watch（2026-05-20）、SHM／Gilead pocket card（2026-03）與 CME Outfitters 2026-01 摘要核對，全文未讀到，強度與證據等級請確認。"},
  IDSA_COV_RDV:{s:"IDSA COVID（住院 remdesivir）",f:"IDSA Guidelines on the Treatment and Management of Patients with COVID-19（living guideline，2025-05-30 版）。住院未用氧且 SpO2 >94%：建議不常規使用 remdesivir；用氧但未插管／ECMO：建議 remdesivir 5 天（優於 10 天）；插管或 ECMO：建議不常規開始 remdesivir（皆 conditional）。依 InpharmD 與 SHM pocket card 轉述，請以原文確認。"},
  NIH_COV24:{s:"NIH COVID 2024（已封存）",f:"NIH COVID-19 Treatment Guidelines（最後更新 2024-02-29，之後停止更新）。因 COVID 住院、未用氧：免疫低下（BIIb）或其他高風險（BIII）者給 remdesivir；一般氧氣：remdesivir＋dexamethasone（BIIa）；HFNC／NIV：dexamethasone（AI）或 dexamethasone＋remdesivir（BIIb）。"},
  WHO_COV23:{s:"WHO COVID 2023",f:"A living WHO guideline on drugs for covid-19（BMJ 2023-11-10 更新）。非重症：高與中風險者 nirmatrelvir/ritonavir；remdesivir、molnupiravir 不用於中低風險（高風險者 conditional）；低風險者 remdesivir、molnupiravir strong against。"},
  TW_COV_OAV:{s:"疾管署 COVID 口服藥 2026",f:"衛生福利部疾病管制署「公費 COVID-19 治療用口服抗病毒藥物領用方案」第 14 次修訂（115-03-10），引用「新型冠狀病毒（SARS-CoV-2）感染臨床處置指引」之臨床條件：Paxlovid 具任一重症風險因子、未用氧且發病 5 天內之成人；molnupiravir 為無法用 Paxlovid 或 remdesivir 之 ≥18 歲（不用於懷孕）；ensitrelvir 為無法用 Paxlovid 或 remdesivir 之 ≥12 歲、發病 3 天內（孕婦禁用）。本 app 只列臨床條件，不列公費資格。",u:"https://health.tainan.gov.tw/warehouse/B972CCC7-8E95-43A2-B339-39C5366979DD/F_1773215365517e.pdf"},
  TW_COV_MOL:{s:"疾管署 molnupiravir 說明",f:"衛福部新聞稿（疾管署）：WHO 與我國臨床處置指引優先使用 Paxlovid 與 remdesivir；molnupiravir 效果有限且機轉有安全疑慮，列為「有條件下使用」，對象包括重度肝腎功能不全、與 Paxlovid 有嚴重交互作用且無法停藥或換藥者。Paxlovid 已取得藥證（112 年 5 月）。",u:"https://mohw.gov.tw/cp-16-79185-1.html"},
  PAX_LABEL:{s:"Paxlovid 仿單",f:"PAXLOVID（nirmatrelvir tablets; ritonavir tablets）US PI。eGFR ≥60：300/100 mg BID × 5 天；30–<60：150/100 mg BID；<30（含 HD）：第 1 天 300/100 mg 一次，第 2–5 天 150/100 mg QD，透析日於 HD 後給。Child-Pugh C 不建議。禁止併用：alfuzosin、amiodarone、apalutamide、carbamazepine、colchicine（腎或肝功能不全）、dihydroergotamine、dronedarone、eletriptan、enzalutamide、eplerenone、ergotamine、finerenone、flecainide、flibanserin、ivabradine、lomitapide、lovastatin、lumacaftor/ivacaftor、lurasidone、methylergonovine、口服 midazolam、naloxegol、phenobarbital、phenytoin、pimozide、primidone、propafenone、quinidine、ranolazine、rifampin、rifapentine、St. John's Wort、sildenafil（PAH 用）、silodosin、simvastatin、suzetrigine、tolvaptan、triazolam、ubrogepant、voclosporin。lovastatin、simvastatin 可暫停後使用。嚴重不良反應最常見的併用藥為 calcineurin inhibitor（tacrolimus、cyclosporine）。警語：ritonavir 為 HIV protease inhibitor，未控制或未診斷 HIV-1 感染者使用，HIV 可能對 protease inhibitor 產生抗藥。",u:"https://www.pfizermedical.com/paxlovid/highlights"},
  PAX_EU:{s:"Paxlovid 歐英 SmPC",f:"Paxlovid EU／UK SmPC（emc）：重度腎功能不全（eGFR <30）或腎衰竭禁用（劑量未確定）；中度 150/100 mg BID。與美國仿單（eGFR <30 有劑量）不同；歐洲最新版是否已更新請確認。",u:"https://www.medicines.org.uk/emc/search?q=paxlovid"},
  RDV_LABEL:{s:"Remdesivir 仿單",f:"Veklury（remdesivir）US PI：住院者 200 mg IV 第 1 天，之後 100 mg QD（未插管 5 天，插管／ECMO 10 天）；門診高風險 200 mg 第 1 天、100 mg 第 2–3 天（PINETREE）。2023-07 FDA 核准用於任何腎功能（含透析）不需調整、不需 eGFR 檢查（REDPINE）。ALT ≥10 倍上限不建議開始。",u:"https://www.gilead.com/news/news-details/2023/fda-approves-veklury-remdesivir-for-covid-19-treatment-in-patients-with-severe-renal-impairment-including-those-on-dialysis"},
  MOL_LABEL:{s:"Molnupiravir 說明書",f:"Lagevrio（molnupiravir）FDA EUA／台灣專案輸入：800 mg（4 × 200 mg）BID × 5 天，發病 5 天內，≥18 歲；不需腎調整；不建議用於懷孕。"},
  ENS_TW:{s:"Ensitrelvir（台灣專案輸入）",f:"Xocova（ensitrelvir）依疾管署領用方案：第 1 天 375 mg，第 2–5 天 125 mg QD；發病 3 天內；不需腎調整；孕婦或可能懷孕者禁用；腎功能不全併用 colchicine 者不可用。強效 CYP3A 抑制劑。美國 FDA 未核准、IDSA 2025 未納入。"},
  ONT_COV25:{s:"Ontario Health 2025",f:"Ontario Health. Summary of Recommendations for Drug Therapy for Adults with COVID-19（2025-07）。嚴重度定義（SpO2 >92%）；remdesivir 若 nirmatrelvir/ritonavir 不能用，7 天內開始；嚴重者開始 remdesivir 後進展為危急仍完成療程。"},
  // RSV
  ECIL4_RSV:{s:"ECIL-4（RSV）",f:"【ECIL-10（2025／26）已更新呼吸道病毒建議，見 ECIL10_CARV；本條保留供對照】Hirsch HH, et al. Fourth European Conference on Infections in Leukaemia (ECIL-4): guidelines for diagnosis and treatment of human respiratory syncytial virus, parainfluenza virus, metapneumovirus, rhinovirus, and coronavirus. Clin Infect Dis 2013;56:258–66。HSCT／血液惡性腫瘤 RSV：可延後 conditioning、aerosolized ribavirin，或 off-label 全身性 ribavirin 及／或 IVIG。各條強度本版未逐條核對。"},
  RBV_ORAL:{s:"Oral vs aerosolized ribavirin（CID）",f:"Foolad F, et al. Oral versus aerosolized ribavirin for the treatment of RSV infections in HCT recipients. Clin Infect Dis 2019（124 例）：上→下呼吸道進展與 30 天死亡率兩組相近，口服可作替代。"},
  INST_RSV:{s:"院內 RSV 指引（UCSF、UNMC）",f:"UCSF Medical Center Guideline for Management of Adult RSV（2022–2023）與 UNMC oral ribavirin guideline（2024 修訂）：ribavirin 只用於 HSCT／血液腫瘤與肺移植等特定族群，不經驗性使用；肺移植上呼吸道一般不治療（咳嗽痰多或 3 個月內移植／加強免疫抑制可考慮）、下呼吸道治療；口服劑量各中心不同（例：10–20 mg/kg/日分 3 次 × 7–10 天）。屬機構指引，非學會指引。",u:"https://idmp.ucsf.edu/node/11916"},
  // HSV/VZV
  CDC_STI21:{s:"CDC STI 2021（生殖器疱疹）",f:"Workowski KA, et al. Sexually Transmitted Infections Treatment Guidelines, 2021. MMWR Recomm Rep 2021;70(4)。初次：acyclovir 400 mg TID、famciclovir 250 mg TID 或 valacyclovir 1 g BID，7–10 天（未癒合可延長）。復發間歇：acyclovir 800 mg BID × 5 天或 TID × 2 天、famciclovir 1 g BID × 1 天／500 mg 一次後 250 mg BID × 2 天／125 mg BID × 5 天、valacyclovir 500 mg BID × 3 天或 1 g QD × 5 天。抑制：acyclovir 400 mg BID、valacyclovir 500 mg QD（≥10 次／年可能較差）或 1 g QD、famciclovir 250 mg BID。HIV：間歇 acyclovir 400 mg TID、famciclovir 500 mg BID、valacyclovir 1 g BID 各 5–10 天；抑制 acyclovir 400–800 mg BID–TID、famciclovir 500 mg BID、valacyclovir 500 mg BID。懷孕 36 週起抑制：acyclovir 400 mg TID 或 valacyclovir 500 mg BID。重症：IV acyclovir 5–10 mg/kg q8h 2–7 天或至改善，再口服完成總療程 ≥10 天。",u:"https://www.cdc.gov/stiapp/herpes-genital_ado_adult.html"},
  EDF_HZ17:{s:"EDF/EADV 帶狀疱疹 2017",f:"Werner RN, et al. European consensus-based (S2k) Guideline on the Management of Herpes Zoster – guided by the EDF in cooperation with EADV, Part 2: Treatment. J Eur Acad Dermatol Venereol 2017;31:20–29。↑↑：≥50 歲任何部位、頭頸部、中重度疼痛、出血壞死、>1 節段、衛星病灶、黏膜侵犯、免疫低下（#18）；↑：<50 歲軀幹四肢無併發症（#19）；72 小時內開始，複雜或高風險、眼耳部、免疫低下者 72 小時後仍可（#23）；<50 歲無併發症 >72 小時 ↓（#24）。IV acyclovir 用於複雜 HZ 或高風險（#20），內臟／CNS 可升到 15 mg/kg TID、最長 21 天。ARN：IV acyclovir 10 mg/kg TID 7–10 天後口服 800 mg 5 次／日 3–4 個月（↑↑ #26）＋類固醇（↑ #27）。Ramsay Hunt：IV acyclovir＋口服類固醇（↑ #28）。眼部：acyclovir 3% 眼藥膏 5 次／日（↑↑ #42）。懷孕無併發症風險者不建議（↓ #29），有風險者 acyclovir 優先（↑ #30）。Brivudin 禁用於免疫低下及 4 週內用過 5-fluoropyrimidine 者。",u:"https://discovery-pp.ucl.ac.uk/id/eprint/1545541/1/Breuer_European_Zoster_guideline_2_Treatment.pdf"},
  MSD_HZ:{s:"MSD Manual 帶狀疱疹 2026",f:"MSD Manual Professional：herpes zoster（2026-05 更新）。famciclovir、valacyclovir 口服生體可用率較 acyclovir 好，為優先；一般 7–10 天；免疫低下者有專家建議延長到全部結痂；輕度免疫低下可口服，嚴重免疫低下用 IV acyclovir；懷孕以 acyclovir 優先、valacyclovir 可用，famciclovir 懷孕資料少一般不建議。",u:"https://www.merckmanuals.com/professional/infectious-diseases/herpesviruses/herpes-zoster"},
  CDC_VAR:{s:"CDC 水痘臨床指引",f:"CDC. Clinical Guidance for People at Risk for Severe Varicella。VariZIG 暴露後盡快、10 天內；口服 acyclovir 或 valacyclovir 可用於中重度風險者（含 >12 歲未接種者），出疹 24 小時內給；IV acyclovir 用於重症（肺炎、腦炎、血小板低下、嚴重肝炎）、免疫低下（含高劑量類固醇 >14 天）、懷孕併發症；acyclovir 抗藥者用 foscarnet。",u:"https://www.cdc.gov/chickenpox/hcp/clinical-guidance/"},
  VAR_PEP:{s:"水痘暴露後預防（CDC／AAP）",f:"Marin M, et al. MMWR 2013（VariZIG）與 AAP Red Book 2018（Lachiewicz, Prev Med Rep 2019 表 3 整理）：無免疫力且高風險（免疫低下、懷孕等）：VariZIG 125 IU/10 kg（最多 625 IU）IM，10 天內（理想 96 小時內）；無 VariZIG → IVIG 400 mg/kg；兩者皆無 → 暴露後第 7–10 天開始 acyclovir 或 valacyclovir 共 7 天（AAP：acyclovir 20 mg/kg QID、上限 800 mg／次；valacyclovir 20 mg/kg TID、上限 1 g／次）。可接種者 3–5 天內接種疫苗。"},
  IDSA_ENC08:{s:"IDSA 腦炎 2008",f:"Tunkel AR, et al. The Management of Encephalitis: Clinical Practice Guidelines by the IDSA. Clin Infect Dis 2008;47:303–27。HSV 腦炎：IV acyclovir 10 mg/kg q8h 14–21 天（A-III）；疑似時盡快經驗性開始。VZV 腦炎：acyclovir（B-III）。本版依二手摘要（MedLink、AMBOSS）核對 HSV 部分，VZV 劑量與療程請確認。"},
  UK_ENC12:{s:"英國 ABN/BIA 腦炎 2012",f:"Solomon T, et al. Management of suspected viral encephalitis in adults – ABN and BIA National Guidelines. J Infect 2012（Hosp Med 2014 流程圖）。入院 6 小時內開始 IV acyclovir；確診 HSV/VZV 腦炎 14 天後重做 LP；免疫低下（及 3 個月–12 歲兒童）21 天；PCR 仍陽性則繼續。"},
  HSE_DK26:{s:"丹麥 HSV-1 腦炎世代（CID 2026）",f:"Clin Infect Dis 2026;82(6):e1384。丹麥全國 HSV-1 腦炎世代：LP 後延遲 acyclovir >6 小時，6 個月死亡相對風險 1.85（95% CI 1.01–3.45）；英、法、丹麥指引建議入院 6 小時內開始。觀察性研究。",u:"https://academic.oup.com/cid/article/82/6/e1384/8495099"},
  UK_MEN16:{s:"英國腦膜炎指引 2016",f:"McGill F, et al. The UK joint specialist societies guideline on the diagnosis and management of acute meningitis and meningococcal sepsis in immunocompetent adults. J Infect 2016;72:405–38（BMJ Best Practice 轉引）。病毒性腦膜炎沒有證實有效的特定治療，抗病毒藥不常規使用，由專科決定；acyclovir／valacyclovir 不常規作為反覆 HSV 腦膜炎的預防；若專科開始長期治療，1 年後停。"},
  AURELIUS12:{s:"Aurelius RCT（CID 2012）",f:"Aurelius E, et al. Long-term valacyclovir suppressive treatment after herpes simplex virus type 2 meningitis: a double-blind, randomized controlled trial. Clin Infect Dis 2012;54:1304–13。101 名原發或復發 HSV-2 腦膜炎，先 valacyclovir 1 g TID 1 週，之後 0.5 g BID 或安慰劑 1 年：未減少復發，停藥後第 2 年復發風險反而較高；不建議用於預防復發。",u:"https://pubmed.ncbi.nlm.nih.gov/22460966/"},
  HSVM_SURV22:{s:"HSV-2 腦膜炎治療調查（OFID 2022）",f:"Open Forum Infect Dis 2022（ofac644）醫師問卷（223 人）：39% 一律治療、34% 重症才治療、10% 很少治療；最常用 IV acyclovir 後改 valacyclovir（61%）；IV 劑量多為 10 mg/kg TID（91%）；總療程中位數 7 天（IQR 7–10）；58% 對免疫低下者處置不同（延長療程或 IV）。屬實務調查，非指引。",u:"https://pmc.ncbi.nlm.nih.gov/articles/PMC9772874/"},
  ACV_IV_LABEL:{s:"Acyclovir 注射劑仿單",f:"Acyclovir sodium injection US PI／加拿大 monograph：免疫低下黏膜皮膚 HSV 5 mg/kg q8h × 7 天；HSV 腦炎 10 mg/kg q8h × 10 天；免疫低下 VZV 10 mg/kg q8h × 7 天；最大相當 20 mg/kg q8h。肥胖者以理想體重（IBW）計。腎調整：CrCl >50 q8h；>25–50 q12h；>10–25 q24h；≤10：50% 劑量 q24h；HD 6 小時約清除 60%，透析後給。英國 SmPC：CAPD 劑量減半 q24h；並註明依實際體重給藥的肥胖者血中濃度較高。",u:"https://pdf.hres.ca/dpd_pm/00074361.PDF"},
  ACV_OBESE:{s:"肥胖者 acyclovir 劑量（文獻與院內）",f:"Aboelezz A, Mahmoud SH. Acyclovir dosing in herpes encephalitis: a scoping review. J Am Pharm Assoc 2024;64:102040：肥胖者用哪個體重缺乏一致證據。UCSF 院內劑量建議：肥胖者先用 adjusted BW，密切監測腎功能與神智；NHS Fife 院內指引（2026-04 審閱）：BMI ≥30 用 adjusted BW＝IBW＋0.4 ×（實際－IBW）。與仿單（IBW）不同。",u:"https://idmp.ucsf.edu/node/8236"},
  ACV_PO_LABEL:{s:"Acyclovir 口服仿單",f:"Acyclovir tablets／capsules US PI：帶狀疱疹 800 mg q4h 5 次／日 × 7–10 天；初次生殖器疱疹 200 mg 5 次／日 × 10 天；抑制 400 mg BID；成人水痘 800 mg QID × 5 天。腎調整：800 mg q4h → CrCl 10–25：800 mg q8h；0–10：800 mg q12h；200 mg q4h 或 400 mg q12h → CrCl 0–10：200 mg q12h。"},
  VAL_LABEL:{s:"Valacyclovir 仿單",f:"Valtrex（valacyclovir）US PI：帶狀疱疹 1 g TID × 7 天；初次生殖器疱疹 1 g BID × 10 天；復發 500 mg BID × 3 天；抑制 1 g QD（≤9 次／年可 500 mg QD；HIV 500 mg BID）；口唇疱疹 2 g BID × 1 天。腎調整表（CrCl 30–49／10–29／<10）：帶狀疱疹 1 g q12h／1 g q24h／500 mg q24h；初次 不變／1 g q24h／500 mg q24h；復發 不變／500 mg q24h／500 mg q24h；抑制 1 g 不變／500 mg q24h／500 mg q24h，500 mg 不變／500 mg q48h／500 mg q48h；口唇 1 g ×2／500 mg ×2／500 mg 單次。HD 後給。",u:"https://ndclist.com/ndc/67296-0200/label"},
  FAM_LABEL:{s:"Famciclovir 仿單",f:"Famvir（famciclovir）US PI：帶狀疱疹 500 mg q8h × 7 天（CrCl 40–59：q12h；20–39：q24h；<20：250 mg q24h；HD：每次透析後 250 mg）；復發生殖器 1 g BID × 1 天（40–59：500 mg q12h × 1 天；20–39：500 mg 單次；<20：250 mg 單次；HD 後 250 mg）；口唇 1500 mg 單次（40–59：750 mg；20–39：500 mg；<20：250 mg）；抑制 250 mg BID（20–39：125 mg q12h；<20：125 mg q24h；HD 後 125 mg）；HIV 復發 500 mg BID × 7 天（20–39：500 mg q24h；<20：250 mg q24h）。",u:"https://www.novartis.us/sites/www.novartis.us/files/famvir.pdf"},
  HIV_OI_VZV:{s:"HIV 兒童 OI 指引（VZV）",f:"Panel on Opportunistic Infections in Children with HIV. Varicella-Zoster Virus（clinicalinfo.hiv.gov）：acyclovir 抗藥的 VZV 對 valacyclovir、famciclovir、ganciclovir 也全部抗藥；懷疑抗藥時盡量做病毒分離與藥敏。",u:"https://clinicalinfo.hiv.gov/en/guidelines/hiv-clinical-guidelines-pediatric-opportunistic-infections/varicella-zoster-virus"},
  // CMV
  CMV_SOT25:{s:"CMV SOT 國際共識 2025",f:"Kotton CN, et al. The Fourth International Consensus Guidelines on the Management of Cytomegalovirus in Solid Organ Transplantation. Transplantation 2025;109:1066–1110（GRADE）。預防：腎 D+/R− prophylaxis（valganciclovir、ganciclovir 或 letermovir；strong, high）6 個月；腎 R+ 3 個月；肝 D+/R− 3–6 個月、R+ 3 個月；心 D+/R− 3–6 個月、R+ 3 個月；肺 D+/R− 12 個月、R+ 6–12 個月；胰、腸、VCA 建議 prophylaxis。D−/R−（用去白血球或 CMV 陰性血品）不需 CMV 預防，應考慮其他疱疹病毒預防（strong, high）。Preemptive：至少每週 12–16 週。不建議低劑量 valganciclovir。治療：valganciclovir 900 mg q12h 或 IV ganciclovir 5 mg/kg q12h（strong, moderate），輕中度可口服者口服優先；危及生命或重症用 IV（strong, low）；不用 acyclovir、valacyclovir、口服 ganciclovir；至少 2 週並至臨床緩解且 DNAemia 低於院內閾值（高敏感度單次 <LLOQ，或兩次每週檢體）；前 2 週病毒量持平或上升但臨床改善不換藥；不因白血球低而減量；用未標準化 GFR（如 CG mL/min）調劑量。難治：≥2 週適當治療後下降 ≤1 log10；累積 ≥4 週且 ≥2 週反應不佳時做基因型（檢體 >3 log10 IU/mL；UL97、UL54，letermovir 看 UL56）；maribavir 為抗藥主要替代（strong, high），避免用於 CNS 或視網膜炎、不可與 ganciclovir 併用；foscarnet 用於病況差、病毒量高（常用 ≥4.7 log10）者（weak, low）；cidofovir 試驗表現差；letermovir 單用治療證據不足；IVIG 可考慮於重症（weak, low）；次級預防不常規，高風險 8–12 週。",u:"https://pmc.ncbi.nlm.nih.gov/articles/PMC12180710/"},
  VGC_LABEL:{s:"Valganciclovir 仿單",f:"Valcyte（valganciclovir）仿單：誘導 900 mg BID（CMV 視網膜炎 21 天），維持／預防 900 mg QD；美國：腎移植預防至移植後 200 天，心、腎胰至 100 天；英國：SOT 至 100 天，腎移植可延到 200 天。腎調整（錠劑）CrCl 40–59：450 mg BID／450 mg QD；25–39：450 mg QD／450 mg QOD；10–24：450 mg QOD／450 mg 每週 2 次；<10（HD）錠劑不建議；口服液（英國）HD：誘導 200 mg、維持 100 mg 每週 3 次於透析後。",u:"https://www.medicines.org.uk/emc/product/14225/smpc/print"},
  GCV_LABEL:{s:"Ganciclovir 注射劑仿單",f:"Cymevene（ganciclovir）SmPC（EMA referral annex）：治療誘導 5 mg/kg q12h × 14–21 天；preemptive 誘導 5 mg/kg q12h × 7–14 天；維持 5 mg/kg QD。腎調整（誘導／維持）CrCl ≥70：5 q12h／5 q24h；50–69：2.5 q12h／2.5 q24h；25–49：2.5 q24h／1.25 q24h；10–24：1.25 q24h／0.625 q24h；<10（HD）：1.25／0.625 mg/kg 每週 3 次於透析後。ANC <500 或血小板 <25,000 避免使用。",u:"https://www.ema.europa.eu/documents/referral/cymevene-article-30-referral-annex-iii_it.pdf"},
  FOS_LABEL:{s:"Foscarnet 仿單",f:"Foscavir（foscarnet）US PI：CMV 誘導 90 mg/kg q12h 或 60 mg/kg q8h × 2–3 週，維持 90–120 mg/kg QD；acyclovir 抗藥 HSV 40 mg/kg q8–12h × 2–3 週或至癒合。腎調整以 CrCl（mL/min/kg）計：CMV 90 mg/kg q12h 欄 >1.4：90 q12h；>1.0–1.4：70 q12h；>0.8–1.0：50 q12h；>0.6–0.8：80 q24h；>0.5–0.6：60 q24h；0.4–0.5：50 q24h；<0.4 不建議。HSV 40 mg/kg q12h 欄：40 q12h／30 q12h／20 q12h／35 q24h／25 q24h／20 q24h。黑框：腎毒性為主要毒性，需水化並頻繁監測 Cr；電解質（Ca、Mg、K、P）異常可致癲癇。",u:"https://globalrph.com/dilution/foscarnet-foscavir/"},
  CDV_LABEL:{s:"Cidofovir 仿單",f:"Vistide（cidofovir）US PI：誘導 5 mg/kg IV 每週 1 次 × 2 週，維持 5 mg/kg 每 2 週；每次須併用 probenecid（輸注前 3 小時 2 g、輸注後 2 與 8 小時各 1 g）與 1 L 生理食鹽水預先水化。SCr >1.5 mg/dL、CrCl ≤55 mL/min 或尿蛋白 ≥100 mg/dL（≥2+）禁止開始；用藥中 Cr 上升 0.3–0.4 → 維持劑量降為 3 mg/kg，上升 ≥0.5 或 ≥3+ 蛋白尿停藥；每次給藥前 48 小時內檢查 Cr 與尿蛋白。",u:"https://www.gilead.com/-/media/files/pdfs/medicines/other/vistide/vistide.pdf"},
  LET_LABEL:{s:"Letermovir 仿單",f:"Prevymis（letermovir）SmPC／US PI：allo-HSCT CMV R+（≥30 kg）480 mg QD，移植日至移植後 28 天內開始，用到第 100 天，晚發風險高者可用到第 200 天；腎移植 D+/R−（≥40 kg）480 mg QD，移植日至 7 天內開始，用到第 200 天。併用 cyclosporine 時 240 mg QD。輕、中、重度腎功能不全不需調整；ESRD（含透析）無建議；靜脈劑型含 cyclodextrin，CrCl <50 可能蓄積。禁止併用 pimozide。無 HSV／VZV 活性。",u:"https://www.medicines.org.uk/emc/product/11943/smpc"},
  LET_200:{s:"Letermovir 延長到 200 天（Lancet Haematol 2024）",f:"Extended-duration letermovir prophylaxis after allogeneic HSCT（MK-8228-040）. Lancet Haematol 2024;11:e127–e135（phase 3，第一作者請確認）：高風險 R+ 延長至 200 天，降低晚發臨床顯著 CMV 感染，安全性相近。"},
  MAR_LABEL:{s:"Maribavir 仿單",f:"Livtencity（maribavir）US PI：400 mg BID（美國未定療程；EU 8 週），治療移植後對 ganciclovir、valganciclovir、cidofovir 或 foscarnet 難治（含或不含抗藥）之 CMV。美國：併用 carbamazepine 或 rifabutin 增為 800 mg BID，phenytoin 或 phenobarbital 增為 1,200 mg BID；EU：無法避免強或中度 CYP3A 誘導劑（carbamazepine、efavirenz、phenobarbital、phenytoin）時 1,200 mg BID，rifampin、rifabutin、St. John's Wort 不建議。禁止與 ganciclovir、valganciclovir 併用。會升高 CYP3A、P-gp、BCRP 敏感受質濃度（如 tacrolimus）。台灣：克巨染膜衣錠（台灣武田）。美國仿單：不建議與 ganciclovir、valganciclovir 併用（maribavir 抑制 pUL97，可能拮抗其活性）；EU SmPC 則列為禁忌（見 MAR_EU）。",u:"https://www.accessdata.fda.gov/drugsatfda_docs/label/2023/215596s004lbl.pdf"},
  ECIL7_CMV:{s:"ECIL-7（CMV，2019；已被 ECIL-10 更新）",f:"【ECIL-10（2025）已更新此指引，本條保留供對照】Ljungman P, et al. Guidelines for the management of cytomegalovirus infection in patients with haematological malignancies and after stem cell transplantation from the 2017 ECIL-7. Lancet Infect Dis 2019;19:e260–e272。本版未取得全文，HSCT 的 preemptive 閾值與療程請確認；成大藥劑部摘要：高劑量 acyclovir／valacyclovir 可減少感染但不減少疾病，foscarnet 毒性大不適合長期預防，letermovir 減少感染且無明顯毒性。",u:"https://nckuhpharmacy.hosp.ncku.edu.tw/var/file/72/1072/img/723/653973735.pdf"},
  ECIL10_CMV:{s:"ECIL-10（CMV，2025）",f:"Ljungman P, et al. Lancet Infect Dis 2025;25(8):e451–e462. doi:10.1016/S1473-3099(25)00069-6。更新 ECIL-7（2019）：涵蓋 CMV 血清狀態評估、免疫監測、letermovir 預防、難治與抗藥 CMV、兒童；CAR-T 與 T 細胞接合型抗體列為新增風險族群。本版取得前言與關鍵訊息，建議強度（PDF 文字 OCR 錯亂）未核對・請確認。"},
  CDV_REV10:{s:"Cidofovir 抗病毒活性綜述（Viruses 2010）",f:"Andrei G, Snoeck R. Cidofovir activity against poxvirus infections. Viruses 2010;2(12):2803–2830（PMC3185586）。綜述指出 cidofovir 的體外活性包括：腺病毒、對 acyclovir 抗藥（病毒 TK 突變）的 HSV 與 VZV、UL97 突變的 CMV、EBV、polyoma 與乳突病毒，以及 orthopox（含 monkeypox、variola）。屬體外與動物資料，非核准適應症。"},
  HHV6_CDV:{s:"HHV-6 抗病毒藥綜述表（PMC4910875）",f:"HHV-6 治療綜述的藥物表（PMC4910875，標題與期刊本版未核對・請確認）：cidofovir 為無環核苷膦酸類，體外對 HHV-6 活性佳；因腎毒性列為二線；病毒 U38（DNA polymerase）突變可造成抗藥。ECIL 對 cidofovir 用於 HHV-6B 腦炎的資料評為不足、無建議（見 ECIL7_HHV6）。"},
  ECIL7_HHV6:{s:"ECIL-7 HHV-6 更新（2017 投影片）",f:"ECIL-7 CMV and HHV-6 update group（Ljungman P, de la Camara R, Crocchiolo R, Einsele H, Hubacek P, Hill J）。HHV-6 update final slide set, 2017-09-23。本條來源為投影片（土耳其 EKMUD 轉載），期刊版（2019）本版未核對・請確認。重點：HSCT 後不建議常規篩檢血中 HHV-6 DNA，不建議預防或 preemptive 抗病毒（DIIu）；HHV-6B 腦炎用 foscarnet 或 ganciclovir（AIIu），依病人狀況選擇，foscarnet 90 mg/kg bid、ganciclovir 5 mg/kg bid（AIIu），至少 3 週並到血中（可能時含腦脊髓液）HHV-6 DNA 清除（BIII）；可考慮兩藥併用（CIII）；可能時減免疫抑制（BIII）；cidofovir 資料不足、無建議。"},
  JSHCT_HHV6:{s:"JSHCT HHV-6B 腦炎建議",f:"Clinical practice recommendations for the diagnosis and management of human herpesvirus-6B encephalitis after allogeneic hematopoietic stem cell transplantation（日本造血細胞移植學會 JSHCT，GRADE）。來源為轉載全文，期刊卷頁本版未核對・請確認。重點：疑似 HHV-6B 腦炎時診斷同時即給經驗性抗病毒（strong）；foscarnet 為首選（weak）、ganciclovir 次選（weak）；嚴重確診者可考慮兩藥併用（weak）；盡可能給最大劑量（strong；foscarnet 180 mg/kg/日、ganciclovir 10 mg/kg/日）；至少治療 3 週（weak）。"},
  OFID_HHV6_22:{s:"HHV-6B 指引比較（OFID 2022）",f:"Open Forum Infect Dis 2022;9(8):ofac398（綜述）：比較 ECIL 2019、JSHCT 2019、ASTCT 2021（含臍帶血移植）對 HHV-6B 監測與治療的建議；一線為 ganciclovir 與 foscarnet；兩藥併用可能減少長期神經後遺症但未證實降低死亡率，指引僅建議嚴重者考慮；無 HHV-6B 腦炎的隨機試驗，療程不明。ASTCT 2021 條文本版未核對・請確認。"},
  FOS_HHV6_OBS:{s:"HHV-6 短療程 foscarnet（回溯性）",f:"Vittayawacharin P, et al. Once-daily foscarnet is effective for human herpesvirus 6 reactivation after hematopoietic stem cell transplantation（單中心回溯性，allo-HSCT 成人 11 人，foscarnet 60–90 mg/kg 每日一次 × 7 天，第 7 天血漿 HHV-6 DNA 皆測不到）。非指引、無對照；與 ECIL「不建議 preemptive」不同方向，列作對照。"},
  CIHHV6:{s:"染色體整合 HHV-6（ciHHV-6）",f:"MJHID 2018 病例報告與綜述：約 2% 人口帶染色體整合 HHV-6（ciHHV-6），每個體細胞都有病毒基因組，血中 DNA 拷貝數極高但沒有病毒再活化。來源為病例報告，比例請確認。"},
  ECIL6_EBV:{s:"ECIL-6（EBV 與 PTLD）2016",f:"Styczynski J, et al. Management of Epstein-Barr virus infections and post-transplant lymphoproliferative disorders in patients after allogeneic HSCT: Sixth European Conference on Infections in Leukemia (ECIL-6) guidelines. Haematologica 2016（卷頁本版未核對）。本版取得摘要與前言：allo-HSCT 病人與捐贈者移植前都應驗 EBV 抗體；治療策略含預防、preemptive、標靶治療；rituximab、減免疫抑制、EBV 特異性 T 細胞為一線，未篩選 DLI 或化療為二線；抗病毒藥不建議（摘要片段）。各條強度與 DNAemia 門檻未核對・請確認。2021 年綜述指出 HCT 最新指引仍是 ECIL-6。"},
  AST_PTLD19:{s:"AST-IDCOP PTLD／EBV（SOT）2019",f:"Allen UD, Preiksaitis JK; AST Infectious Diseases Community of Practice. Post-transplant lymphoproliferative disorders, Epstein-Barr virus infection, and disease in solid organ transplantation. Clin Transplant 2019;33:e13652. doi:10.1111/ctr.13652。摘要：預防性策略證據品質低；EBV DNA 以週邊血測定（檢測需調和）合併降低病毒量的措施，減免疫抑制（RIS）是驗證最多的介入；組織病理（WHO 分類）是 PTLD 診斷標準；CD20+ PTLD 依反應序貫使用 RIS、rituximab、細胞毒性化療。全文本版未取得・請確認。"},
  TID_EBV25:{s:"EBV 再活化先減免疫抑制（TID 2025）",f:"Transpl Infect Dis 2025（doi 10.1111/tid.70124，巴西單中心回溯性，allo-HCT 328 人）：EBV 再活化 178 人（累積 54.6%），先減免疫抑制、rituximab（375 mg/m²，1–2 次每週）只用於減量無效、終器官病變或 PTLD；rituximab 僅 12 人（6.7%），無 PTLD。為觀察性、單中心；該文指出 preemptive rituximab 被建議但沒有明確的 EBV DNAemia 門檻（證據強度中等、來自非對照研究）。"},
  TABCEL26:{s:"Tabelecleucel（tab-cel）FDA 進度 2026",f:"Pierre Fabre／Atara 新聞（2026-10）：EBV 特異性異體 T 細胞（Ebvallo），用於 ≥2 歲 SOT 或 HCT 後 EBV+ PTLD 經治療失敗者。FDA 於 2025-01 與 2026-01 兩度發 CRL（第二次質疑 ALLELE 試驗可否支持加速核准）；BLA 於 2026-10-14 再次受理，PDUFA 目標日 2027-03-31。美國目前未核准。台灣可及性本版未查證・請確認。"},
  ASTCT_CMV25:{s:"ASTCT CMV 2025",f:"Khawaja F, Zamora D, Yong MK, Hakki M, et al. Series #11: Updated Cytomegalovirus Guidelines in Hematopoietic Cell Transplant and Cellular Therapy Recipients. Transplant Cell Ther 2025（2025-06-20 接受）。更新 2021 版：移植前血清、letermovir 預防期間、maribavir 的地位等。本版只看到摘要片段・內容請確認。"},
  ECIL10_CARV:{s:"ECIL-10（呼吸道病毒，2025／26）",f:"von Lilienfeld-Toal M, et al. Community-acquired respiratory virus infections in patients with haematological malignancies or haematopoietic cell transplantation: updated recommendations from ECIL-10. Lancet Infect Dis 2026;26(3):e193–e206（2025-08-27 線上發表）。doi:10.1016/S1473-3099(25)00365-2。更新 ECIL-4（2013）。摘要：RSV 已核准疫苗可依當地核准考慮（證據少）；免疫缺陷評分高的 HCT 受者建議口服 ribavirin 或 IVIG，或兩者併用。各條強度本版未取得全文・請確認。"},
  ECIL9_HEP:{s:"ECIL-9（HBV、HCV、HEV，2025）",f:"Mikulska M, et al. Updated recommendations for the management of hepatitis B, C, and E virus infections in patients with haematological malignancies and those undergoing HCT: ECIL-9. Lancet Haematol 2025（PMID 40306834）。本版只確認其存在，內容未核對・請確認。"},
  PRIT_NEWS:{s:"Pritelivir（Hovilpri）FDA 核准 2026",f:"FDA 2026-10-09 核准 Hovilpri（pritelivir）100 mg 錠：免疫低下成人、對 acyclovir／valacyclovir／famciclovir 難治（含或不含抗藥證據）的黏膜皮膚 HSV 病灶。依據 PRIOH-1 Part C（NCT03073967，101 人，open-label，對照為研究者選擇的 foscarnet、cidofovir 或 imiquimod）：第 28 天完全癒合 63% vs 34%（校正差 28.4 個百分點，95% CI 9.6–47.3）。用法：第 1 天 400 mg，之後 100 mg QD，用到病灶癒合。PPI：避免 esomeprazole、rabeprazole；omeprazole、lansoprazole 每日 >20 mg、pantoprazole 每日 >40 mg 亦避免。本條來源為 Drugs.com、FDA 新聞轉載與學會報導，不是仿單全文・請確認。"},
  BEPI_NEWS:{s:"Bepirovirsen（Hibsago）FDA 核准 2026",f:"FDA 2026-10-20 核准 Hibsago（bepirovirsen，GSK）：與 NA 併用，用於無肝硬化成人慢性 B 型肝炎；皮下注射最多 24 週，NA 在最後一次注射後至少續用 24 週。B-Well 1／2（Hou J, et al. N Engl J Med 2026;394(24):2395–2406）：已用 NA 抑制 DNA、HBsAg ≤3,000 IU/mL 的無肝硬化成人，300 mg 每週（第 4、11 天另有 loading）× 24 週；功能性治癒（停藥後 DNA 低於定量下限且 HBsAg 陰性 ≥24 週）19% vs 0%（合併 233/1,220 vs 0/614）。有 boxed warning，內容本版未取得・請確認。本條來源為 FDA／GSK 新聞與媒體報導，不是仿單全文。"},
  BLV_NEWS:{s:"Bulevirtide（Hepcludex）FDA 2026",f:"FDA 2026-05-22 accelerated approval：Hepcludex（bulevirtide-gmod）8.5 mg 皮下注射 QD，用於無肝硬化或代償性肝硬化的慢性 HDV 成人；持續到不再有反應，最佳療程未知；confirmatory 長期結果試驗進行中。依據 MYR301（phase 3，Wedemeyer H, et al. N Engl J Med 2023;389:22–32）。歐盟、英國等已核准 2 mg。不降低 HBV 病毒量；停藥可能復發。本條來源為 Gilead 新聞稿與 Hepatitis B Foundation，不是 FDA 仿單全文・請確認。"},
  EASL_HEV18:{s:"EASL HEV 2018",f:"EASL Clinical Practice Guidelines on hepatitis E virus infection. J Hepatol 2018;68:1256–71. doi:10.1016/j.jhep.2018.03.005。重點（來源：摘要與投影片整理，非全文）：嚴重急性 HEV 或 ACLF 可考慮 ribavirin（C2）；實體器官移植的慢性 HEV 診斷時盡可能減少免疫抑制（B1）；HEV RNA 偵測後 3 個月仍持續者建議 ribavirin 單用 12 週（B1）；12 週後血清或糞便仍可測得 HEV RNA 者可續用到共 6 個月（C2）。ribavirin 劑量本版未取得原文・請確認。"},
  AASLD_HEVP:{s:"AASLD HEV 教學文件",f:"AASLD Liver Fellow Network「The neglected viral hepatitis」臨床提示（教學文件，非正式指引）：慢性 HEV 先減免疫抑制，約三分之一可清除；未清除者考慮 ribavirin 12 週；ribavirin 期間第 4、8、12 週查 CBC；第 12 週查血清與糞便 HEV RNA，兩者皆陰性可停藥並於 12 週後複查，陽性則再續 12 週。該文件將 HEV RNA 陽性 >6 個月定義為慢性。"},
  CDPH_MPX25:{s:"CDPH mpox tecovirimat 2025",f:"California Department of Public Health, 2025-04-24 提供者通知「Mpox Treatment with Tecovirimat (TPOXX) and Other Therapeutics」：多數 mpox 為輕症自限，所有病人給支持療法與疼痛處理；tecovirimat 單用在臨床試驗未對輕中度 mpox 有效；沒有專為 mpox 核准的藥物；標準療程 14 天，必要時短期延長（例如再 3–7 天並密切監測安全與反應）；成人與兒童劑量見 CDC EA-IND 計畫書（本版未取得・請確認）。"},
  STOMP25:{s:"STOMP／PALM007（tecovirimat）",f:"NIH／NIAID 2025-03-12 新聞稿（Wilkin T, et al. CROI 2025）：STOMP（clade II，7 國）tecovirimat 14 天單用未縮短病灶消退時間、也未改善疼痛（第 29 天消退約 83% vs 84%），安全性可接受；PALM007（clade I，剛果民主共和國，Tshiani O, et al. IDWeek 2024）同樣無臨床效益；兩試驗皆提前停止。兒童、孕婦、嚴重免疫低下或特定皮膚病者在 STOMP 分在 open-label 組，無隨機療效資料。"},
  TW_LET:{s:"Letermovir 台灣（CDE 報告）",f:"財團法人醫藥品查驗中心 HTA 報告：滅巨斯（PREVYMIS）膜衣錠 240 mg、輸注液 240 mg/12 mL，美商默沙東台灣分公司；許可適應症為異體 HSCT 成人 CMV R+ 之預防。腎移植適應症在台灣是否核准請確認。",u:"https://www.nhi.gov.tw/ch/dl-11648-4166709930df4521b24ba9de9c8667ad-1.pdf"},
  TW_MAR:{s:"Maribavir 台灣",f:"健保署藥品給付規定 10.7.14 Maribavir（如 Livtencity）（113/11/1 生效）：對一種或多種先前療法具抗藥性、難治或耐受度不佳之成人 HSCT 或 SOT 後 CMV 感染或疾病；首次療程限 8 週、需事前審查。本 app 不判定健保給付，此處只用來確認台灣已上市。",u:"https://www.nhi.gov.tw/ch/dl-75354-22ad8c06512243009d07e3f45eda5b3f-1.pdf"},
  // 預防
  ASCO_PX18:{s:"ASCO/IDSA 抗微生物預防 2018",f:"Taplitz RA, et al. Antimicrobial Prophylaxis for Adult Patients With Cancer-Related Immunosuppression: ASCO and IDSA Clinical Practice Guideline Update. J Clin Oncol 2018;36:3043–54（2023-03 確認現行）。建議 3.1：HSV 血清陽性、接受 allo-HSCT 或白血病誘導化療者以 nucleoside analog（如 acyclovir）預防（evidence high, strong）；至白血球恢復或黏膜炎緩解（較晚者），反覆發作或 GVHD 可延長，可延續作 VZV 預防最多 1 年。",u:"https://ace.asco.org/guidelines/32801"},
  INST_HEMEPX:{s:"院內血液腫瘤預防（UC Davis）",f:"UC Davis Health. Antimicrobial prophylaxis for adult hematology-oncology patients（引用 NCCN Prevention and Treatment of Cancer-Related Infections 1.2017、ASCO 2013、IDSA 2011）：proteasome inhibitor（bortezomib、carfilzomib）常規 VZV 預防；SCT 由 conditioning 前 1 天到移植後 365 天；acyclovir 400 mg PO BID（非移植），SCT 劑量依院內表。屬機構指引；NCCN 原文需登入。",u:"https://health.ucdavis.edu/media-resources/antibiotic-stewardship/documents/pdfs/guidelines/guidelines-heme-onc-antimicrobial-prophylaxis-for-adults.pdf"},
  // HBV
  AASLD_HBV25:{s:"AASLD/IDSA HBV 2025",f:"Ghany MG, Pan CQ, Lok AS, Feld JJ, Lim JK, Wang SH, Kim AY, Tang AS. AASLD/IDSA Practice Guideline on treatment of chronic hepatitis B. Hepatology 2026;83(4):974–997（2025-11-04 線上發表）。doi:10.1097/HEP.0000000000001549。本版已讀全文約前 100,000／125,031 字元（含 Table 1、Table 3、Recommendation 1–5、Figure 4–5）；HBV 再活化預防與失代償肝硬化的 entecavir 劑量在未讀段落・請確認。"},
  EASL_HBV25:{s:"EASL HBV 2025",f:"EASL Clinical Practice Guidelines on the management of hepatitis B virus infection（J Hepatol 2025）。首選 entecavir、tenofovir disoproxil、tenofovir alafenamide；不建議 lamivudine、adefovir、telbivudine。PDF 表 14（治療分層）文字擷取不完整，分層細節請以原文確認。"},
  APASL_HBV26:{s:"APASL HBV 2026",f:"You et al.（APASL Viral Elimination Taskforce）. APASL clinical practice guidelines on the management of chronic hepatitis B infection: a 2026 update. Hepatol Int 2026. doi:10.1007/s12072-026-11108-1（2026-02-17 接受）。本版只確認其存在與出處，條文未逐條核對・請確認；再活化預防另有專門指引，本版未取得。"},
  AGA_HBV25:{s:"AGA HBV 再活化 2025",f:"AGA Clinical Practice Guideline on the prevention and treatment of hepatitis B virus reactivation in at-risk individuals（Gastroenterology 2025）。依免疫抑制治療的再活化風險分層，高風險者給預防。本版未取得全文與完整分層表・請確認。"},
  ASCO_HBV20:{s:"ASCO 癌症病人 HBV 篩檢 2020",f:"Hwang JP, et al. Hepatitis B Virus Screening and Management for Patients With Cancer Prior to Therapy: ASCO Provisional Clinical Opinion Update. J Clin Oncol 2020;38:3698–3715。所有開始抗癌治療者篩檢 HBsAg、anti-HBc（total Ig 或 IgG）、anti-HBs；HBsAg 陽性者預防；HBsAg 陰性、anti-HBc 陽性者，接受 anti-CD20 或 HSCT 給預防，其他監測；預防持續到治療結束後至少 12 個月（anti-CD20 更久）。細節請確認。"},
  WHO_HBV24:{s:"WHO HBV 2024",f:"WHO. Guidelines for the prevention, diagnosis, care and treatment for people with chronic hepatitis B infection（2024-03）。擴大治療條件（含 APRI >0.5 或 DNA >2,000 IU/mL 合併 ALT 異常等）；首選 tenofovir 或 entecavir。細節請確認。"},
  ENT_LABEL:{s:"Entecavir 仿單",f:"Baraclude（entecavir）US PI：未曾用 nucleoside 者 0.5 mg QD；lamivudine 難治或失代償肝病 1 mg QD；空腹（餐前後至少 2 小時）。腎調整（CrCl ≥50／30–<50／10–<30／<10 與 HD、CAPD）：0.5 mg 方案 0.5 mg QD／0.25 mg QD 或 0.5 mg q48h／0.15 mg QD 或 0.5 mg q72h／0.05 mg QD 或 0.5 mg q7d；1 mg 方案 1 mg QD／0.5 mg QD 或 1 mg q48h／0.3 mg QD 或 1 mg q72h／0.1 mg QD 或 1 mg q7d；HD 於透析後給。停藥可能急性惡化；乳酸中毒警語。Boxed warning：HIV/HBV 共感染者若未同時接受有效的 HIV 治療（HAART），不建議使用 entecavir，有選出 HIV M184V 變異的風險；M184V 變異對 entecavir 敏感性下降；entecavir 不算 HAART 的一部分。"},
  TDF_LABEL:{s:"Tenofovir disoproxil 仿單",f:"Viread（tenofovir disoproxil fumarate）US PI：300 mg QD。腎調整：CrCl ≥50 q24h；30–49 q48h；10–29 q72–96h；HD 每週 1 次（或累計 12 小時透析後）；未透析 <10 無建議。腎功能、骨密度（磷）監測；停藥可能急性惡化。"},
  TAF_LABEL:{s:"Tenofovir alafenamide 仿單",f:"Vemlidy（tenofovir alafenamide）US PI：25 mg QD 隨餐。CrCl ≥15 不需調整；<15 未透析無建議；HD 病人 25 mg QD，透析日於 HD 後給。禁止併用 rifampin 等強 P-gp 誘導劑；停藥可能急性惡化。HIV：Vemlidy 單用不建議用於 HIV-1 感染（可能產生 HIV 抗藥），開始前先篩 HIV，共感染者須用適當的 HIV 完整方案。"},
  // HCV
  AASLD_HCV:{s:"AASLD/IDSA HCV Guidance（2026）",f:"AASLD-IDSA HCV Guidance（hcvguidelines.org；2026-05 簡化治療文件）。未曾治療、無肝硬化或代償性肝硬化：glecaprevir/pibrentasvir 8 週，或 sofosbuvir/velpatasvir 12 週。基因型 3 代償性肝硬化的 NS5A Y93H 與 ribavirin 條件、腎功能不全與失代償章節的網頁無法開啟，內容來自搜尋摘要・請確認。"},
  EASL_HCV20:{s:"EASL HCV 2020",f:"EASL recommendations on treatment of hepatitis C: Final update of the series（J Hepatol 2020;73:1170）。pangenotypic 方案：glecaprevir/pibrentasvir 8 週（無肝硬化）、sofosbuvir/velpatasvir 12 週；失代償肝硬化 sofosbuvir/velpatasvir ＋ ribavirin 12 週。2023 更新本版未取得・請確認。"},
  MAV_LABEL:{s:"Glecaprevir/pibrentasvir 仿單",f:"Mavyret（glecaprevir/pibrentasvir）US PI：300/120 mg（3 錠）QD 隨餐。未治療無肝硬化 8 週；代償性肝硬化 8 週（美國仿單）。任何腎功能（含透析）不需調整。Child-Pugh B 不建議、C 禁用。禁止併用 atazanavir、rifampin 等；HBsAg 陽性或 anti-HBc 陽性者有 HBV 再活化風險。"},
  EPC_LABEL:{s:"Sofosbuvir/velpatasvir 仿單",f:"Epclusa（sofosbuvir/velpatasvir）US PI：400/100 mg QD；無肝硬化或代償性肝硬化 12 週；Child-Pugh B、C 併用 ribavirin 12 週。美國仿單 sofosbuvir 已不限 eGFR（2019 起 eGFR <30 與透析可用）。避免併用 amiodarone（嚴重心搏過緩）、rifampin、St. John's Wort；質子幫浦抑制劑、H2 阻斷劑、制酸劑有交互作用（依仿單時程）。HBV 再活化警語。"},
  VOX_LABEL:{s:"Sofosbuvir/velpatasvir/voxilaprevir 仿單",f:"Vosevi（sofosbuvir/velpatasvir/voxilaprevir）US PI：400/100/100 mg QD 隨餐，12 週；用於曾接受含 NS5A 抑制劑方案失敗者（或基因型 1a、3 曾接受不含 NS5A 的 sofosbuvir 方案）。Child-Pugh B、C 不建議。"},
  RBV_HCV:{s:"Ribavirin（HCV 併用）",f:"Copegus（ribavirin）US PI 與 EASL 2020：與 DAA 併用時，成人常用 1,000 mg／日（<75 kg）或 1,200 mg／日（≥75 kg）分次隨餐；Child-Pugh C 或貧血者可由 600 mg／日起，依耐受度調整。腎功能：CrCl 30–50 mL/min 隔日交替 200 mg 與 400 mg；CrCl <30 或 HD 200 mg QD（Copegus 仿單，與 DAA 併用的腎功能劑量請確認）。孕婦禁用、男女伴侶避孕至停藥後 6 個月。"},
  // HIV 暴露後與暴露前預防
  CDC_NPEP25:{s:"CDC nPEP 2025",f:"Tanner MR, et al. Antiretroviral Postexposure Prophylaxis After Sexual, Injection Drug Use, or Other Nonoccupational Exposure to HIV — CDC Recommendations, United States, 2025. MMWR Recomm Rep 2025;74(RR-1):1–56（2025-05-08）。本版依 CDC 網頁、PDF 前段與 PMC 摘要核對；劑量表（表 4–6）與 GRADE 附錄未取得。nPEP：暴露有實質傳播風險且來源 HIV 陽性未持續病毒抑制或狀態不明；72 小時內、最好 24 小時內開始，不因檢驗未回而延後；療程 28 天；首選 BIC/FTC/TAF，或 DTG ＋（TAF 或 TDF）＋（FTC 或 3TC）（very low certainty）；不建議 DTG/3TC 雙藥；超過 72 小時證據不足；來源已知持續病毒抑制一般不需 nPEP；懷孕與哺乳非禁忌，cobicistat 加強的 atazanavir、darunavir 與 elvitegravir 不建議用於懷孕；DTG 併用 metformin 限每日 1 g；基線 HIV Ag/Ab、Cr、ALT、AST、HBV、懷孕檢驗；追蹤 4–6 週與 12 週 Ag/Ab＋NAT；6 個月內曾打長效注射 PrEP 者起始加 HIV NAT；nPEP 結束可無縫銜接 PrEP。所有 nPEP 用藥皆為 off-label。",u:"https://www.cdc.gov/mmwr/volumes/74/rr/rr7401a1.htm"},
  PHS_OPEP25:{s:"US PHS oPEP 2025",f:"Kofman AD, et al. 2025 US Public Health Service Guidelines for the Management of Occupational Exposures to HIV and Recommendations for Postexposure Prophylaxis in Healthcare Settings. Infect Control Hosp Epidemiol 2025;46:863–73。本版全文未取得，只依摘要與二手整理（UIC 藥學 FAQ、EATG 與 SHEA 新聞）：首選 BIC/FTC/TAF，或 DTG ＋（TAF 或 TDF）＋（FTC 或 3TC）；替代為 darunavir（併 cobicistat 或 ritonavir）＋（TAF 或 TDF）＋（FTC 或 3TC）；移除 2013 版首選 raltegravir＋TDF/FTC（因需多次給藥）；基線檢驗正常時不再常規追蹤藥物毒性檢驗；最終 HIV 檢驗（實驗室 Ag/Ab＋NAT）不晚於暴露後 12 週；12 個月內用過 CAB 長效 PrEP 的暴露者需加做 HIV 檢驗；有來源病毒量測不到與暴露者正在用 PrEP 的專門建議；腎功能不全（CrCl 30–49、<30）與肝功能不全另有用藥指引。療程、起始時效、劑量與懷孕建議本版未取得。",u:"https://doi.org/10.1017/ice.2025.10254"},
  CDC_PREP21:{s:"CDC PrEP 2021",f:"CDC. Preexposure Prophylaxis for the Prevention of HIV Infection in the United States — 2021 Update: A Clinical Practice Guideline。本版未取得全文，依 CDC 臨床指引網頁與二手整理（CDC 快速指南、AETC、CCO 摘要）：口服 F/TDF（emtricitabine 200 mg／tenofovir DF 300 mg）每日，成人與青少年；F/TAF（200/25 mg）每日，男性與 transgender women；CAB 600 mg IM，第 0、1 個月，之後每 2 個月。F/TDF eCrCl <60 不建議；F/TAF eCrCl ≥30 可用；口服 PrEP 每 3 個月 HIV 檢驗，每次最多開 90 天；CAB 每次注射前 HIV 檢驗（含 HIV-1 RNA），不需定期腎功能與血脂檢驗；<50 歲且 eCrCl ≥90 者每年、其他每 6 個月評估腎功能；F/TAF 每年測 triglyceride、cholesterol 與體重；停 CAB 後 8 週內接口服 PrEP。2-1-1 事件型的新增指引內容本版未取得。",u:"https://www.cdc.gov/hivnexus/hcp/prep/index.html"},
  CDC_LEN25:{s:"CDC lenacapavir PrEP 2025",f:"Patel RR, et al. Clinical Recommendation for the Use of Injectable Lenacapavir as HIV Preexposure Prophylaxis — United States, 2025. MMWR Morb Mortal Wkly Rep 2025;74(35):541–549（2025-09-18）。strongly recommended，高證據確定性（PURPOSE 1、PURPOSE 2），≥35 kg 且可受益於 PrEP 者。第 1 天 927 mg SC（2 針各 1.5 mL，相隔至少 4 吋）＋口服 600 mg，第 2 天口服 600 mg，之後每 26 週（±2 週）927 mg SC。每次注射前需血液實驗室或快篩 HIV Ag/Ab（7 天內），不可用口腔唾液抗體檢驗；起始建議加 HIV-1 RNA；中度與強效 CYP3A 誘導劑需補充劑量，停藥後 9 個月內仍可升高部分藥物濃度；懷孕者經共享決策可開始或繼續；漏打：晚 ≥14 天可用口服 300 mg 每週橋接（<6 個月）。腎功能內容本版取得的文字未論及。",u:"https://www.cdc.gov/mmwr/volumes/74/wr/mm7435a1.htm"},
  EACS25:{s:"EACS 2025（v13.0）",f:"European AIDS Clinical Society Guidelines v13.0（2025-10）；Ambrosioni J, et al. HIV Med 2025。本版依新聞整理（aidsmap、EATG、HIV i-Base；標題與摘要），未取得全文：PEP 首選 BIC/FTC/TAF；PrEP 納入長效 CAB 與 lenacapavir；近 6 週有高風險暴露或使用長效藥時，PrEP 前建議 HIV RNA；對所有人支持事件型 PrEP（2:1:1 或 2:7）；已在口服 PrEP 者暴露後盡快服 2 錠，之後每日 1 錠直到醫師評估；在 PrEP 或長效 CAB 期間感染者，起始治療避免雙藥，CAB 感染者用含 boosted darunavir 的三藥。請以原文確認。",u:"https://eacs.sanfordguide.com/"},
  TW_CDC_HIV:{s:"疾管署簡報（PEP／PrEP）",f:"衛福部疾病管制署愛滋防治簡報（2021 年版，台南某校轉載，屬二手）：PEP 於高風險行為後 72 小時內盡早請醫師評估，每日服藥完整 28 天，藥費自費；PrEP 經醫師評估，每日 1 顆，或視需求服用（事件前 24 小時 2 顆、事件後 24 與 48 小時各 1 顆），藥費自費。簡報年份較舊，請以疾管署最新公告為準。",u:"https://www.tngs.tn.edu.tw/wp-content/uploads/sites/54/2021/11/2021年愛滋防治簡報.pdf"},
  TW_MOHW_PREP:{s:"衛福部 PrEP 澄清稿",f:"衛福部、疾管署新聞澄清稿：PrEP 不是健保給付項目，健保僅給付治療愛滋感染者，不給付 PrEP 服藥者；疾管署 2018–2019 年 PrEP 計畫補助對象為感染者的配偶或伴侶與 30 歲以下高風險行為者，須經醫師評估，服藥前評估 B 肝帶原與肝功能。計畫年份為過去，現行補助請向疾管署確認。",u:"https://mohw.gov.tw/cp-17-47820-1.html"},
  NYSDOH_PEP:{s:"NYSDOH AI PEP 2025",f:"New York State Department of Health AIDS Institute. PEP to Prevent HIV Infection, Tables 2–5（2025-12-05）。≥40 kg 首選：bictegravir 50 mg／TAF 25 mg／emtricitabine 200 mg 單錠每日 1 次，或 dolutegravir 50 mg 每日 1 次加 NRTI 骨幹；皆口服 28 天；dolutegravir 併用 metformin 限每日 1 g；基線 CrCl <50 mL/min 時 3TC／FTC ＋ TDF 需調整劑量。本版為搜尋摘錄，非全文。",u:"https://www.hivguidelines.org/wp-content/uploads/2025/11/NYSDOH-AI-PEP-to-Prevent-HIV-Infection-Tables-2-to-5_12-5-2025_HG.pdf"},
  HIV_LABELS:{s:"HIV 藥物仿單（未核對）",f:"Biktarvy、Tivicay、Truvada、Descovy、Apretude、Yeztugo 的美國仿單：本版未取得仿單全文。腎功能分段、交互作用與禁忌依一般臨床知識與上列指引整理，數字請以仿單與院內藥典逐項核對。BIC/FTC/TAF 與 FTC/TAF 的低腎功能切點（CrCl <30 不建議）、DTG 與 CAB 的交互作用、BIC 與 DTG 使血清肌酸酐上升（抑制腎小管分泌）均屬此類。"},
  IBASE_PEP:{s:"HIV i-Base 2025 報導",f:"Collins S. US CDC updated guidelines on PEP (May 2025). HIV i-Base（2025-05）：整理 CDC 2025 nPEP 更新；指出首選改為第二代 INSTI（bictegravir 或 dolutegravir）＋ tenofovir（TAF 或 TDF）＋ XTC，PEP 仍建議 24 小時內、不晚於 72 小時開始；並註記英國 BASHH/BHIVA 2021 指引仍建議 raltegravir ＋ 另開 TD/FTC。二手報導，英國指引原文本版未取得。",u:"https://i-base.info/htb/?p=51025"},
  // BK 病毒
  TTS_BK24:{s:"TTS BK 2024",f:"Kotton CN, et al. The Second International Consensus Guidelines on the Management of BK Polyomavirus in Kidney Transplantation. Transplantation 2024;108(9):1834–66（GRADE）。本版依全文 PDF 前半（表 4–7）核對，治療失敗與再移植段落被截斷。所有腎移植受者血漿 BKPyV-DNAemia 篩檢：每月至第 9 個月，之後每 3 個月至 2 年（兒童 3 年）（strong, B）；1,000–10,000 copies/mL 於 2–3 週內複驗（weak, B）；>10,000 單次或 1,000–10,000 兩次相隔 2–3 週 → 減免疫抑制（strong B／weak B）；策略 1 先減抗代謝藥 ≥50%，4 週未下降 ≥10 倍則停抗代謝藥並將 prednisone 降至 5–10 mg/日，再降 CNI 至 tacrolimus 約 5 ng/mL 或 cyclosporine 約 100 ng/mL（weak, C）；策略 2 先減 CNI 25–50% 至 tacrolimus 3–5 ng/mL 或 cyclosporine 75–125 ng/mL，4 週未下降再減抗代謝藥（weak, C）；兩種策略無隨機試驗比較；切片證實 PyVAN 即使血漿確認尚未回也減免疫抑制（strong, B）；成人無移植腎功能異常且無高免疫風險不需切片；IHC（SV40 LTag）確診（strong, A）；IVIG 輔助（weak, D）；cidofovir、leflunomide（strong, B）、fluoroquinolone、statin（strong, A）不使用；mTOR 抑制劑轉換證據不足；喪失移植腎後再移植可行，需血漿 DNAemia 測不到，不常規摘除移植腎。",u:"https://doi.org/10.1097/TP.0000000000004976"},
  AST_BK19:{s:"AST-IDCOP BK 2019",f:"Hirsch HH, Randhawa PS; AST IDCOP. BK polyomavirus in solid organ transplantation — Guidelines from the American Society of Transplantation Infectious Diseases Community of Practice. Clin Transplant 2019;33(9):e13528。本版依 PubMed 摘要與 GuidelineCentral 條列核對，全文未取得：腎移植受者以 QNAT 篩檢血漿 BKPyV-DNAemia（Moderate, Strong）；無排斥風險升高且基線腎功能者，減免疫抑制前不需切片（Moderate, Strong）；喪失移植腎後可再移植，需定期篩檢病毒複製。",u:"https://pubmed.ncbi.nlm.nih.gov/30859620/"},
  BTS_BK:{s:"BTS／UK BK 指引",f:"British Transplantation Society. UK Guideline on Management of BK Polyomavirus (BKPyV) Infection and Disease Following Kidney Transplantation。本版依網頁摘要核對：尿 BKPyV PCR 不建議用於監測（1C）；病毒血症者小心減免疫抑制，避免誘發排斥（1C）；減或停 corticosteroid（2D）；未用類固醇者可加類固醇以便移除另一種免疫抑制（2D）；治療失敗者建議切片（1D）；清除後再活化的篩檢間隔 3、6、12 個月（2C）。發表年份與其他細節本版未核對。",u:"https://bts.org.uk/uk-guideline-on-management-of-bk-polyomavirus-bkpyv-infection-and-disease-following-kidney-transplantation/"},
  ECIL7_BKHC:{s:"ECIL BK 膀胱炎 2018",f:"Cesaro S, et al. ECIL guidelines for the prevention, diagnosis and treatment of BK polyomavirus-associated haemorrhagic cystitis in haematopoietic stem cell transplant recipients. J Antimicrob Chemother 2018;73(1):12–21。本版只取得摘要：BKPyV-HC 於異體 HSCT 兒童 8–25%、成人 7–54%；診斷需膀胱炎症狀、肉眼血尿、尿 BKPyV 負荷 >7 log10 copies/mL，並排除其他病因，血中病毒量可作較專一的追蹤指標；無隨機對照試驗支持抗病毒預防或治療；充分水化與膀胱沖洗預防價值有限；fluoroquinolone 預防與治療無效且增加抗藥；高壓氧或纖維蛋白膠僅小型病例系列顯示邊際效果；cidofovir 雖有降低病毒量的報告，現有資料不支持常規使用。全文建議強度本版未取得。",u:"https://pubmed.ncbi.nlm.nih.gov/29190347/"},
  // adenovirus
  ECIL4_ADV:{s:"ECIL-4 腺病毒 2012",f:"Matthes-Martin S, et al. European guidelines for diagnosis and treatment of adenovirus infection in leukemia and stem cell transplantation: summary of ECIL-4 (2011). Transpl Infect Dis 2012;14(6):555–63。本版只取得摘要：兒童風險較高；T 細胞清除、非血緣或臍帶血移植、GVHD III–IV 級與淋巴球低下是風險因子；高風險者以定量 PCR 監測；cidofovir 是最常用的抗病毒藥，但未做對照試驗；腺病毒特異 T 細胞治療發展中。全文建議強度與閾值本版未取得。",u:"https://doi.org/10.1111/tid.12022"},
  AST_ADV19:{s:"AST-IDCOP 腺病毒 2019",f:"Florescu DF, Schaenman JM; AST IDCOP. Adenovirus in solid organ transplant recipients — Guidelines from the American Society of Transplantation Infectious Diseases Community of Practice. Clin Transplant 2019;33(9):e13527。本版依 PubMed 摘要與 GuidelineCentral 核對：無症狀受者不應做腺病毒監測；症狀者定量 PCR 可輔助決定是否治療與評估反應；支持治療與減免疫抑制是首要；抗病毒藥缺乏前瞻隨機試驗，但嚴重、進展或播散性疾病在多數移植中心以 IV cidofovir 為標準做法；cidofovir 應併充分水化與 probenecid，最佳劑量與頻率未知；IVIG 可能對低 γ-球蛋白血症者有益；腺病毒特異 T 細胞治療為未來方向。",u:"https://pubmed.ncbi.nlm.nih.gov/30859626"},
  TID_ADV23:{s:"HCT 腺病毒綜述 2023",f:"Adenovirus infection in allogeneic hematopoietic cell transplantation. Transpl Infect Dis 2023;25 Suppl 1:e14173（綜述，只取得摘要）：異體 HCT 後前 3–4 個月 AdV 感染 0–20%，兒童較高；預防疾病靠早期偵測病毒複製增加，血中達 10^2–3 copies/mL（或糞便 10^6 copies/g）即 preemptive 開始 cidofovir；cidofovir 是目前唯一建議的抗病毒藥，療效有限且有腎毒性；brincidofovir 當時不可取得，仍在其他病毒的研究中。",u:"https://pubmed.ncbi.nlm.nih.gov/37846850/"},
  ADV_CDV:{s:"cidofovir 腺病毒劑量",f:"cidofovir 用於腺病毒為 off-label，無仿單劑量，各中心不同，以下為文獻中常見做法而非指引：5 mg/kg 每週 1 次併 probenecid（EBMT 中心調查中最常用，Cesaro S, et al.，年份與期刊本版未核對）；1 mg/kg 每週 3 次，腎毒性較低（兒童 HSCT 與 SOT 回溯研究，PMC3031399、Pediatr Transplant 2018;22）；CrCl <50 mL/min 者曾用 0.5 mg/kg 每週 3 次（Bruminhent J, et al. Open Forum Infect Dis 2019，腎移植回溯研究）。probenecid 常用 1.25 g/m²：給藥前 3 小時及給藥後 2、8 小時（PMC4863673 回溯研究）。仿單（美國）對 CMV 視網膜炎的限制仍適用於此類腎毒性風險：SCr >1.5、CrCl ≤55 或尿蛋白 ≥2+ 禁止開始。",u:"https://pmc.ncbi.nlm.nih.gov/articles/PMC3031399"},
  MAR_EU:{s:"Maribavir 歐盟 SmPC",f:"Livtencity（maribavir）EMA 產品資訊：與 ganciclovir 或 valganciclovir 併用列為禁忌（maribavir 抑制 pUL97，可能拮抗其活性）。",u:"https://www.ema.europa.eu/documents/product-information/livtencity-epar-product-information_es.pdf"},
  MAR_REV22:{s:"Maribavir 綜述（PMC9487637）",f:"Maribavir 體外對 CMV 與 EBV 有抑制作用，對 HSV-1、HSV-2、VZV、HHV-6、HHV-8 無活性；體外拮抗 ganciclovir（約 13 倍），對 cidofovir、foscarnet 無影響。",u:"https://pmc.ncbi.nlm.nih.gov/articles/PMC9487637"},
  LET_REV20:{s:"Letermovir 綜述（PMC7318821）",f:"Letermovir 只對 CMV 有活性；因對 HSV、VZV 無活性，HSCT 預防期間需另給 acyclovir、valacyclovir 或 famciclovir。",u:"https://pmc.ncbi.nlm.nih.gov/articles/PMC7318821"},
  GCV_US:{s:"Ganciclovir 美國仿單（微生物學）",f:"Ganciclovir 注射劑美國 PI 微生物學段：在人體臨床研究中對 CMV 與 HSV 有活性；核准適應症為 CMV（視網膜炎、移植預防）。VZV 活性未在取得的段落中出現，請確認。",u:"https://ndclist.com/ndc/42023-173/label"},
  FOS_ADIS91:{s:"Foscarnet 藥物評論（Adis 1991）",f:"Chrisp & Clissold, Drugs 1991;41:104。Foscarnet 抑制人類疱疹病毒 DNA polymerase 與 HIV 反轉錄酶；體外抑制 HIV 複製；acyclovir 抗藥 VZV 有部分病例報告成功使用。年代較早，僅作活性範圍參考。",u:"https://link.springer.com/content/pdf/10.2165%2F00003495-199141010-00009.pdf"},
  VAL_CMV99:{s:"Valacyclovir CMV 預防（NEJM 1999）",f:"International Valacyclovir Cytomegalovirus Prophylaxis Transplantation Study Group. Valacyclovir for the prevention of cytomegalovirus disease after renal transplantation. N Engl J Med 1999;340:1462-70。全文未取得，僅引用題目與出處；各國仿單適應症請確認。"},
  DAA_HBV17:{s:"FDA DAA 與 HBV 再活化警示",f:"FDA Drug Safety Communication（2016-10，2017 全類別仿單加 boxed warning）：HCV 直接作用抗病毒藥（DAA）治療的 HBV 共感染者，包含 HBsAg 陽性與 HBsAg 陰性但 anti-HBc 陽性者，可能發生 HBV 再活化，部分致猛爆性肝炎、肝衰竭或死亡；須治療前篩檢，治療中與治療後監測。",u:"https://www.fda.gov/drugs/drugsafety/ucm522932.htm"},
  BIC_LABEL:{s:"Biktarvy 仿單（2025）",f:"Biktarvy（bictegravir/emtricitabine/tenofovir alafenamide）US PI 2025：boxed warning——停用含 emtricitabine 與（或）tenofovir disoproxil 的產品，HIV-1 與 HBV 共感染者可能發生嚴重急性 B 肝惡化，停藥後至少數月密切追蹤肝功能，必要時給 HBV 治療。開始前需檢驗 HBV。",u:"https://www.accessdata.fda.gov/drugsatfda_docs/label/2025/210251s023lbl.pdf"},
  IAS_HBVHIV23:{s:"HBV／HIV 共感染綜述（IAS-USA 2023）",f:"Corcorran & Kim, Top Antivir Med 2023;31:14。共感染者的 ART 以 TDF 或 TAF 加 emtricitabine 或 lamivudine 為骨幹（同時作用於 HBV 與 HIV）；考慮不含 tenofovir 的雙藥方案時需另評估 HBV。",u:"https://www.iasusa.org/wp-content/uploads/2023/03/31-1-14.pdf"},
  DHHS_HBV24:{s:"DHHS 成人 ARV 指引 HBV 章節 2024（二手報導）",f:"POZ 2024-12 報導 DHHS 更新：HIV/HBV 共感染者的 ARV 要有兩個對兩種病毒都有活性的藥（TDF 或 TAF 加 FTC 或 3TC）；採不含 NRTI 的方案（含長效 cabotegravir＋rilpivirine）需另加 HBV 治療，因兩者皆無 HBV 活性；避免未加 HBV 藥就轉 dolutegravir/lamivudine。僅取得二手報導，DHHS 原文請確認。",u:"https://newprod1.poz.com/article/dhhs-updates-hepatitis-b-guidelines-people-hiv"},

      while((m=re.exec(t))){ const k=m[2], st=m.index+m[1].length; if(seen.has(k)) continue; seen.add(k); changed=true; frag.append(t.slice(last,st)); const b=document.createElement("button"); b.type="button"; b.className="gl"; b.dataset.gl=k; b.textContent=k; frag.append(b); last=st+k.length; }

}

    if(ub){ showOv("更新",`<p>${esc(ub.dataset.upd)}</p>`); return; }
    const gb=e.target.closest("button.gl[data-gl]");
    if(gb){ const k=gb.dataset.gl; showOv(k,`<p>${esc(GLOSS[k]||"")}</p>`); return; }
  });
  const q=$("q");
  q.addEventListener("input",()=>renderQ(q.value));
  q.addEventListener("keydown",e=>{ if(e.key==="Enter"&&QH.length){ e.preventDefault(); $("qres").querySelector(".qitem").click(); } else if(e.key==="Escape"){ q.value=""; renderQ(""); } });
  document.addEventListener("click",e=>{ if(!e.target.closest(".srch")) $("qres").hidden=true; });
  q.addEventListener("focus",()=>{ if(q.value.trim()) renderQ(q.value); });
  let wasNarrow=narrow();
  addEventListener("resize",()=>{ const n=narrow(); if(n!==wasNarrow){ wasNarrow=n; renderPt(); } });
  const NAV_JUMP=new Set(["go","go-drug","go-dx","go-px","res-go"]);
  const histSync=()=>{ try{ const t=NAV[NAV.length-1]; return !!(t&&history.state&&history.state.nav===t.id); }catch(e){ return false; } };
  function navBack(t){ let sn=null; while(NAV.length&&NAV[NAV.length-1].id>t) sn=NAV.pop(); if(!sn) return; navRestore(sn); renderMain(); renderPt(); scrollTo(0,sn.y); }
  function navDrop(k){ if(k<=0) return; const sync=histSync(); NAV.splice(NAV.length-k,k); if(sync){ try{ history.go(-k); }catch(e){} } }
  addEventListener("popstate",e=>{ navBack((e.state&&e.state.nav)||0); });
  document.addEventListener("click",e=>{
    const b=e.target.closest("button[data-act]"); if(!b) return;
    const a=b.dataset.act, v=b.dataset.v;
    const pre=NAV_JUMP.has(a)||(a==="tab"&&v==="ref"&&S.tab!=="ref")?[navSnap(),navLabel(),scrollY]:null;
    if(a==="nav-back"){ if(!NAV.length) return; if(histSync()) history.back(); else navBack(0); return; }
    if(a==="tab"){ if(v!=="ref"){ let i=-1; NAV.forEach((n,j)=>{ if(n.tab===v) i=j; }); if(i>=0) navDrop(NAV.length-i); } S.tab=v; if(narrow()&&UI.pt){ UI.pt=false; renderPt(); } scrollTo(0,0); }
    else if(a==="pt-open"){ UI.pt=true; renderPt(); if(narrow()){ $("ptBody").scrollIntoView({block:"start"}); if(!S.pt.age) $("age").focus({preventScroll:true}); } return; }
    else if(a==="clear-all"){ clearAll(); return; }
    else if(a==="pt-close"){ UI.pt=false; renderPt(); $("ptBar").focus(); return; }
    else if(a==="m-more"){ UI.mMore=!UI.mMore; renderPt(); return; }
    else if(a==="disc-ok"){ $("disc").hidden=true; $("footDisc").hidden=false; return; }
    else if(a==="ov-close"){ $("ov").hidden=true; return; }
    else if(a==="go"){ const x=QH[+b.dataset.i]; if(!x) return; goHit(x); $("q").value=""; $("qres").hidden=true; if(narrow()&&UI.pt){ UI.pt=false; renderPt(); } scrollTo(0,0); }
    else if(a==="dx"){ S.dx=v; UI.dxpick=false; }
    else if(a==="dxpick") UI.dxpick=!UI.dxpick;
    else if(a==="dxo"){ S.o[S.dx]=Object.assign({},S.o[S.dx],{[b.dataset.k]:v}); }
    else if(a==="px"){ S.px=v; UI.pxpick=false; }
    else if(a==="pxpick") UI.pxpick=!UI.pxpick;
    else if(a==="pxo"){ S.po[S.px]=Object.assign({},S.po[S.px],{[b.dataset.k]:v}); }
    else if(a==="drug"){ S.drug=v; UI.dpick=false; }
    else if(a==="dpick") UI.dpick=!UI.dpick;
    else if(a==="spec-v"){ UI.spV=(v&&UI.spV!==v)?v:""; }
    else if(a==="go-drug"){ S.tab="drug"; S.drug=v; UI.dpick=false; scrollTo(0,0); }
    else if(a==="go-dx"){ S.tab="tx"; S.dx=v; UI.dxpick=false; scrollTo(0,0); }
    else if(a==="go-px"){ S.tab="px"; S.px=v; UI.pxpick=false; scrollTo(0,0); }
    else if(a==="res-k") S.res=S.res===v?"":v;
    else if(a==="res-go"){ S.tab="res"; S.res=v; if(narrow()&&UI.pt){ UI.pt=false; renderPt(); } scrollTo(0,0); }
    else if(a==="copy"){ copyText(decodeURIComponent(b.dataset.txt)); return; }
    else if(a==="onote"||a==="srcs-tog"){ const n=b.closest(".opt").querySelector(a==="onote"?".onote.fold":".srcs.fold"); if(n){ n.hidden=!n.hidden; b.setAttribute("aria-expanded",String(!n.hidden)); } return; }
    else if(a==="brand"){ const host=b.closest(".rx")||b.closest(".step")||b.parentElement; const sp=host.querySelector(".rx-more"); if(sp){ sp.hidden=!sp.hidden; b.setAttribute("aria-expanded",String(!sp.hidden)); } return; }
    else return;
    if(pre&&navKey(navSnap())!==navKey(pre[0])) navPush(pre[0],pre[1],pre[2]);
    renderMain();
    if((a==="res-k"||a==="res-go")&&S.res){ const el=$("res-"+S.res); if(el) el.scrollIntoView({block:"start"}); }
  });
  readPt(); renderRsum(); renderMain(); renderPt();
}
</script>
</body>
</html>
